<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Portal do cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .months{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
  .months button.m{min-width:72px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px;line-height:1.3;color:var(--soft)}
  .months button.m small{display:block;color:var(--muted);font-size:11px}
  .months button.m.on{border-color:var(--orange);background:rgba(255,88,11,.12);color:#fff;box-shadow:0 0 0 1px var(--orange)}
  .seg3{display:flex;gap:8px;flex-wrap:wrap}
  .seg3 button{padding:10px 22px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--soft)}
  .seg3 button.on{background:var(--orange);border-color:var(--orange);color:#fff}
  .posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .post{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .post .img{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:14px;color:#fff;font-family:Georgia,serif;font-size:20px;line-height:1.15;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  .post .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .post .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
  .strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
  .strip div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px}
  .strip .t{aspect-ratio:1;border-radius:7px;margin:6px 0}
  .preview-bar{background:var(--orange);color:#fff;text-align:center;font-size:12.5px;padding:7px;font-weight:600}
  @media (max-width:1100px){.posts{grid-template-columns:1fr 1fr}.strip{grid-template-columns:repeat(4,1fr)}}
  @media (max-width:560px){.posts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="preview-bar">Prévia do portal: é assim que o cliente vê. <a href="configuracoes.html" style="text-decoration:underline">Voltar ao sistema</a></div>
<div class="app">
  <aside class="sidebar" id="sidebar" style="height:calc(100vh - 32px)">
    <span class="logo">PERIFÉRICA</span>
    <nav class="nav">
      <a href="#" class="active"><i data-lucide="home"></i>Início</a>
      <a href="#"><i data-lucide="layout-list"></i>Meus conteúdos</a>
      <a href="#"><i data-lucide="square-check"></i>Aprovações<span class="badge b-solid-orange" style="margin-left:auto;padding:2px 7px">3</span></a>
      <a href="#"><i data-lucide="calendar-days"></i>Calendário</a>
      <a href="#"><i data-lucide="folder"></i>Arquivos</a>
    </nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const G=['linear-gradient(160deg,#f1d6c4,#b98466)','linear-gradient(160deg,#d9e4ea,#8aa3b3)','linear-gradient(160deg,#efe4d6,#a88d74)','linear-gradient(160deg,#f4e2cf,#c59d78)'];
const posts=[['Post – Dicas de skincare no verão','10/11/2026',''],['Post – Bastidores da clínica','12/11/2026',''],['Post – Depoimento de paciente','14/11/2026','Resultados que vão além da estética.']];
let tab=0;const now=new Date();
const main=document.getElementById('main');
function render(){
  main.innerHTML=`
  <header class="topbar"><div class="row" style="gap:14px">${PF.chip('Clínica Vida+','lg')}<div class="page-title"><h1>Clínica Vida+</h1><p>Saúde / Estética</p></div></div>
    <div class="top-right"><button class="bell"><i data-lucide="bell"></i></button><div class="me">${PF.avatar('Ana Luiza','md')}<div><b>Ana Luiza</b><small>Clínica Vida+</small></div></div></div></header>
  <h3 class="mb">Resumo de ${now.toLocaleDateString('pt-BR',{month:'long'})}</h3>
  <section class="grid g5 mb">
    ${PF.kpi({icon:'file-text',color:'purple',value:'12',label:'Posts produzidos'})}${PF.kpi({icon:'circle-play',color:'gray',value:'2',label:'Vídeos produzidos'})}
    ${PF.kpi({icon:'send',color:'blue',value:'1',label:'Campanha'})}${PF.kpi({icon:'star',color:'yellow',value:'3',label:'Stories'})}
    ${PF.kpi({icon:'id-card',color:'gray',value:'5',label:'Outros materiais',sub:'(banners, capas, etc.)'})}
  </section>
  <div class="months mb"><button class="icon-btn"><i data-lucide="chevron-left"></i></button>${Array.from({length:12},(_,i)=>{const d=new Date(now.getFullYear(),i,1);return `<button class="m ${i===now.getMonth()?'on':''}">${d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','').replace(/^./,c=>c.toUpperCase())}<small>${now.getFullYear()}</small></button>`;}).join('')}<button class="icon-btn"><i data-lucide="chevron-right"></i></button></div>
  <div class="row between wrap mb"><div class="seg3">${['Para aprovar (3)','Com ajustes (1)','Aprovados (8)'].map((l,i)=>`<button class="${i===tab?'on':''}" data-t="${i}">${l}</button>`).join('')}</div><button class="btn btn-ghost"><i data-lucide="calendar"></i>Ver calendário do mês</button></div>
  <section class="posts mb">${posts.map(([t,d,txt],i)=>`<div class="post"><div class="img" style="background:${G[i]}">${txt}</div><div class="b"><div class="row between"><b class="small">${t}</b><i data-lucide="ellipsis-vertical" class="muted"></i></div>${PF.badge('Social media','gray')}<span class="small">${d}</span></div>
    <div class="acts"><button class="btn btn-ghost" data-adj="${i}">Solicitar ajuste</button><button class="btn btn-primary" data-ok="${i}">Aprovar</button></div></div>`).join('')}</section>
  <div class="card"><div class="card-head"><h3>Calendário de publicações — ${now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><a class="link tiny" href="#">Ver lista completa <i data-lucide="arrow-right"></i></a></div>
    <div class="strip">${[['Seg','02','Post','var(--blue)'],['Qua','04','Post','var(--orange)'],['Sex','06','Post','var(--blue)'],['Seg','09','Stories','var(--yellow)'],['Qua','11','Reels','var(--purple)'],['Sex','13','Post','var(--orange)'],['Seg','16','Post','var(--blue)'],['Qua','18','Campanha','var(--green)']].map(([w,d,t,c],i)=>`<div>${w}<br><b>${d}</b><div class="t" style="background:${G[i%4]}"></div><span class="row" style="justify-content:center;gap:5px"><i class="dot" style="background:${c}"></i>${t}</span></div>`).join('')}</div></div>`;
  PF.icons();
  main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;render();});
  main.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{b.closest('.post').style.opacity=.4;PF.toast('Aprovado! A equipe já foi avisada.','ok');});
  main.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{const t=prompt('O que você gostaria de ajustar?');if(t)PF.toast('Pedido de ajuste enviado.','ok');});
}
render();
</script>
</body>
</html>
