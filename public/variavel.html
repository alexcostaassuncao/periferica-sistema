<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Meu Variável</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .vals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .vals .card b{font-size:30px;display:block;margin:6px 0 2px;letter-spacing:-.5px}
  .crit{display:grid;grid-template-columns:44px 1fr 100px 60px 110px 24px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
  .crit:last-child{border:0}
  .crit small{display:block;color:var(--muted);font-size:11.5px}
  .neg{color:var(--pink);font-weight:600;text-align:right}
  .zero{color:var(--soft);text-align:right}
  .imp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .imp .card{background:linear-gradient(180deg,rgba(255,88,11,.08),var(--panel))}
  .imp .inner{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:10px;padding:10px;margin-top:12px;font-size:12.5px}
  @media (max-width:1100px){.imp{grid-template-columns:1fr 1fr}.crit{grid-template-columns:40px 1fr 80px 90px}.crit>:nth-child(4),.crit>:nth-child(6){display:none}}
  @media (max-width:560px){.vals,.imp{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
const content=PF.shell({title:'Meu Variável',subtitle:'Seu resultado, calculado automaticamente a partir do que já está registrado no sistema.',crumbs:[['Equipe'],['Meu Variável']],search:false,
  actions:`<select class="select-in" style="width:auto"><option>${PF.monthLabel(new Date())}</option></select>`});
const base=500;
const crit=[['users','orange','Reuniões e relacionamento','Atas enviadas até o dia 10','100%','green',0],['calendar-check','green','Entregas','Publicações até o dia 31','80%','yellow',-10],['circle-x','pink','Cancelamentos','1 cancelamento na squad','1 ocorrência','solid-red',-25]];
const total=base*(1+crit.reduce((a,c)=>a+c[6],0)/100);
content.innerHTML=`
<div class="split" style="grid-template-columns:1fr 1fr">
  <div class="stack">
    <div class="vals">
      <div class="card"><span class="muted small">Valor inicial do mês</span><b>${PF.brl(base)},00</b><span class="muted tiny">para todos os usuários</span></div>
      <div class="card" style="border-color:rgba(255,88,11,.5)"><span class="muted small">Valor previsto</span><b style="color:var(--orange)">${PF.brl(total)},00</b><span class="muted tiny">Sujeito a alterações até o fechamento.</span></div>
    </div>
    <div class="card"><div class="card-head"><h2>Detalhamento dos critérios</h2>${PF.demo()}</div>
      ${crit.map(([i,c,t,s,v,vc,p])=>`<div class="crit"><span class="ico md c-${c}"><i data-lucide="${i}"></i></span><div><b>${t}</b><small>${s}</small></div>${PF.badge(v,vc)}<span class="${p?'neg':'zero'}">${p}%</span><span class="${p?'neg':'zero'}">${p?'-':''}${PF.brl(Math.abs(base*p/100))},00</span><i data-lucide="chevron-right" class="muted"></i></div>`).join('')}
    </div>
  </div>
  <div class="card"><div class="card-head"><div><h2>Como o valor é calculado</h2><p>Exemplo: cancelamento de cliente</p></div></div>
    <div class="flow" style="flex-direction:column">
      ${[['file-text','Registro único','O cancelamento é registrado uma vez, em Financeiro → Contratos.'],['settings','Processamento automático','O sistema identifica o squad do cliente e aplica as regras definidas.'],['bar-chart-3','Atualização em tempo real','O desconto aparece aqui para todos os usuários do squad.']].map(([i,t,d],k)=>`<div class="step" style="flex-direction:row;align-items:center;gap:14px"><span class="ico md c-orange round"><i data-lucide="${i}"></i></span><div><b>${k+1}. ${t}</b><p>${d}</p></div></div>`).join('')}
    </div>
  </div>
</div>
<h3 style="margin:22px 0 12px">Atualiza automaticamente em todas as áreas</h3>
<section class="imp">
  ${[['users','Clientes','Status do cliente e histórico.',`${PF.chip('Estação Lanches')}<div>Estação Lanches<br>${PF.badge('Cancelado','solid-red')}</div>`],['file-text','Financeiro','Registro de cancelamento e impacto na receita.',`<i data-lucide="file-text"></i><div>Estação Lanches<br><b style="color:var(--pink)">- R$ 2.199,00</b></div>`],['calendar-check','Gestão','Ajuste de entregas e tarefas do cliente.',`<input type="checkbox" class="chk" checked disabled><div style="flex:1">Finalizar entregas pendentes</div>${PF.badge('Pendente','yellow')}`],['bar-chart-3','Meu Variável','Desconto aplicado aos usuários do squad.',`<span class="avatar md" style="background:#3a4250">C3</span><div style="flex:1">Estação Lanches<br><span class="muted tiny">1 cancelamento</span></div><b style="color:var(--pink)">-25%</b>`]].map(([i,t,d,inner])=>`<div class="card"><div class="row"><i data-lucide="${i}" style="color:var(--orange);width:26px;height:26px"></i><div><b>${t}</b><div class="muted tiny">${d}</div></div></div><div class="inner">${inner}</div></div>`).join('')}
</section>
<div class="grid g2" style="margin-top:16px">
  <div class="note"><i data-lucide="lightbulb"></i><div><b style="color:var(--orange)">Objetivo</b><br>Dar ao usuário visibilidade clara do seu desempenho, com informações automáticas, confiáveis e integradas.</div></div>
  <div class="note"><i data-lucide="circle-check"></i><div><b style="color:var(--orange)">Resultado</b><br>Mais organização, menos planilhas e um processo de variável justo e eficiente para toda a equipe.</div></div>
</div>`;
PF.icons();
</script>
</body>
</html>
