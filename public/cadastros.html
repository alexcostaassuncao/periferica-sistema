<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Cadastros</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .cad{display:flex;flex-direction:column;gap:10px;padding:18px;text-decoration:none;color:inherit}
  .cad .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cad p{color:var(--soft);font-size:13px;line-height:1.5;margin:0}
  a.cad:hover{border-color:var(--orange)}
  .cad.soon{opacity:.75}
  .price{white-space:nowrap}
</style>
</head>
<body>
<script>
// Cadastros do sistema num só lugar. Vai crescendo aos poucos: o que ainda não existe aparece como "Em breve".
const content=PF.shell({title:'Cadastros',subtitle:'Clientes, produtos e serviços, usuários, contratos e mais.',crumbs:[['Cadastros']],search:false});
const esc=PF.esc;
const CARDS=[
  ['produtos','package','orange','Produtos e serviços','Catálogo compartilhado pelo site de contato e pelo Comercial.','#produtos'],
  ['clientes','contact','blue','Clientes','Ficha completa: contratos, serviços, equipe, documentos, histórico e cofre de senhas.','clientes.html'],
  ['contratos','file-signature','purple','Contratos','Modelos de Gestão e Projetos, elaboração, envio e assinatura.','contratos.html'],
  ['usuarios','user-cog','green','Usuários','Equipe, perfis de acesso, áreas liberadas e carteiras.','equipe.html'],
  ['ponto','clock','yellow','Relógio ponto','Registro de entrada e saída da equipe.',null],
];
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function render(){
  let C=null;try{C=await PF.api('/api/catalog');}catch(e){PF.toast(e.message,'err');}
  content.innerHTML=`
  <section class="grid g3 mb">${CARDS.map(([k,icon,color,title,desc,href])=>`${href?`<a class="card cad fade" href="${href}">`:`<div class="card cad soon fade" id="${k}">`}
    <div class="top"><div class="ico c-${color}"><i data-lucide="${icon}"></i></div>${href?'<i data-lucide="chevron-right" class="muted"></i>':PF.badge('Em breve','gray')}</div>
    <b>${title}</b><p>${desc}</p>${href?'</a>':'</div>'}`).join('')}</section>
  <div class="card mb" id="produtos"><div class="card-head"><div><h2>Produtos e serviços</h2><p>É a lista que aparece para escolher no Comercial (lead e proposta) e no site. Os valores da proposta são definidos em cada oportunidade.</p></div></div>
    ${C?`<div class="grid g3">${[['gestao','Gestão e tráfego','purple'],['projeto','Sites, e-commerce e branding','blue'],['outro','Outros serviços','orange']].map(([key,title,color])=>`
      <section class="card flat"><b>${title}</b><div class="row wrap" style="gap:8px;margin-top:10px">${(C.catalog[key]||[]).map(n=>PF.badge(n,color)).join('')}</div></section>`).join('')}</div>
    <details class="card flat" style="margin-top:14px"><summary class="small" style="cursor:pointer;font-weight:600">Modelos de contrato de Gestão (detalhes e preços)</summary>
    <h3 class="small" style="margin:12px 0 8px">Planos disponíveis</h3>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>Plano</th><th>Inclui</th><th>Investimento mínimo em anúncios</th><th>Implantação / mensalidade</th></tr></thead><tbody>
      ${C.plans.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="small">${[p.trafego&&'Tráfego pago',p.social&&'Social media'].filter(Boolean).join(' + ')||'—'}</td>
        <td class="small">${p.investMin?brl(p.investMin)+'/mês':'—'}</td>
        <td class="small">${p.precos.length?p.precos.map(x=>`<div class="price">${esc(x.modalidade)}: ${x.implantacao?brl(x.implantacao)+' + ':''}${brl(x.mensal)}/mês</div>`).join(''):'Definido na proposta'}</td></tr>`).join('')}
    </tbody></table></div></details>
    <p class="muted tiny" style="margin-top:14px">Para incluir ou alterar serviços do catálogo, fale com o desenvolvedor.</p>`
    :'<div class="empty"><i data-lucide="package-open"></i><div>Não foi possível carregar o catálogo.</div></div>'}</div>`;
  PF.icons();
  if(location.hash==='#produtos')document.getElementById('produtos').scrollIntoView({block:'start'});
  if(location.hash==='#ponto')PF.toast('O Relógio ponto ainda está em construção.','ok');
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
