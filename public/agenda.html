<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .split{grid-template-columns:1fr 340px}
  .cal.wk{grid-template-columns:repeat(5,minmax(0,1fr))}
  .cal .day:nth-child(7n){border-right:1px solid var(--line)}
  .cal.wk .day:nth-child(5n){border-right:0}
  .cal .ev{flex-direction:column;align-items:flex-start;gap:3px;padding:6px 7px}
  .cal .ev b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cal .ev small{display:flex;gap:8px;color:var(--muted);font-size:10.5px}
  .cal .ev small .lucide{width:11px;height:11px}
  .gcal{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;font-size:13px}
  .gcal .g{width:22px;height:22px;border-radius:5px;background:#fff;color:#1a73e8;font-weight:800;font-size:11px;display:grid;place-items:center}
  .places{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .places label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:10px;font-size:12.5px;cursor:pointer}
  .places input{display:none}
  .places label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
  .room{display:flex;gap:12px;align-items:center}
  .room .ph{width:64px;height:52px;border-radius:8px;background:linear-gradient(135deg,#4b3a2c,#2a2018);display:grid;place-items:center;color:#d6b894}
  @media (max-width:1200px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
const content=PF.shell({title:'Agenda',subtitle:'Reuniões, participantes e salas — integrado ao Google Calendar.',crumbs:[['Agenda']],search:'Buscar na agenda...',
  actions:`<span class="gcal"><span class="g">31</span>Google Calendar ${PF.badge('Em breve','gray')}</span><button class="btn btn-primary" id="nm"><i data-lucide="plus"></i>Nova reunião</button>`});
const COL=['var(--blue)','var(--purple)','var(--green)','var(--yellow)','var(--pink)','var(--orange)'];
const PL={sala:['door-open','Sala de Reunião'],estudio:['video','Estúdio'],cliente:['map-pin','Cliente'],mesa:['monitor','Minha mesa']};
let cur=new Date();cur.setDate(1);
const today=new Date();
// eventos de exemplo distribuídos pelo mês atual
const SAMPLE=[['09:00','Reunião – Mercado Doce','sala',3],['10:30','Alinhamento – C2','estudio',4],['14:00','Reunião – Elegance','cliente',2],['09:30','Planejamento – C3','mesa',3],['11:00','Workshop campanha','estudio',5],['09:00','Reunião – Filetto','cliente',2],['08:00','Alinhamento – C1','sala',3],['10:30','Reunião – Pizzadoro','cliente',2],['09:00','Revisão de entregas','mesa',3],['15:00','Reunião – Estação','estudio',3],['08:30','Planejamento mensal','sala',4],['11:00','Reunião – ELOWAY','cliente',2],['14:00','Apresentação site','estudio',3],['09:00','Reunião – M2 Uniformes','sala',3],['13:00','Treinamento equipe','mesa',5],['10:00','Reunião – Super Amigos','cliente',2],['15:00','Review campanhas','estudio',4],['09:30','Alinhamento – C2','sala',3],['14:00','Reunião – Gastron','cliente',2],['10:00','Fechamento mês','mesa',4]];
let events=[];
function seed(){
  events=[];let k=0;const y=cur.getFullYear(),m=cur.getMonth();
  for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const wd=new Date(y,m,d).getDay();if(wd===0||wd===6)continue;const e=SAMPLE[k%SAMPLE.length];events.push({date:new Date(y,m,d).toDateString(),time:e[0],title:e[1],place:e[2],n:e[3],c:COL[k%COL.length]});if(d===today.getDate()&&m===today.getMonth())events.push({date:new Date(y,m,d).toDateString(),time:'14:00',title:'Reunião interna',place:'mesa',n:4,c:'var(--orange)'});k++;}
}
function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  let start=new Date(y,m,1);while(start.getDay()!==1)start.setDate(start.getDate()-1);
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+Math.floor(i/5)*7+i%5);
    if(i>=25&&d.getMonth()!==m&&i%5===0)break;
    const evs=events.filter(e=>e.date===d.toDateString());
    cells+=`<div class="day ${d.getMonth()!==m?'out':''} ${d.toDateString()===today.toDateString()?'today':''}"><span class="num">${String(d.getDate()).padStart(2,'0')}</span>
      ${evs.map(e=>`<div class="ev" style="--c:${e.c}"><b>${e.time} ${PF.esc(e.title)}</b><small><span><i data-lucide="${PL[e.place][0]}"></i> ${PL[e.place][1]}</span><span><i data-lucide="users"></i> ${e.n}</span></small></div>`).join('')}</div>`;
  }
  content.innerHTML=`<div class="split">
    <div class="card">
      <div class="row between wrap mb"><div class="tabs" style="margin:0;border:0"><button class="on">Minha agenda</button><button>Equipe</button><button>Salas</button><button>Todos</button></div>${PF.demo()}</div>
      <div class="row between wrap mb">
        <div class="row"><button class="btn btn-ghost" id="today">Hoje</button><button class="icon-btn" id="prev"><i data-lucide="chevron-left"></i></button><button class="icon-btn" id="next"><i data-lucide="chevron-right"></i></button><b style="font-size:15px">${cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}</b></div>
        <div class="toggle"><button>Semana</button><button class="on">Mês</button><button>Lista</button></div>
      </div>
      <div class="cal wk">${['Seg','Ter','Qua','Qui','Sex'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    </div>
    <aside class="stack">
      <div class="card" id="form">${form()}</div>
      <div class="card"><div class="card-head"><h3>Salas</h3><a class="link tiny" href="#">Ver todas</a></div>
        <div class="room"><div class="ph"><i data-lucide="armchair"></i></div><div style="flex:1"><b class="small">Sala de Reunião</b><div class="row" style="margin-top:4px">${PF.badge('Disponível','solid-green')}<span class="muted tiny">Capacidade: 6 pessoas</span></div></div><i data-lucide="chevron-right" class="muted"></i></div></div>
    </aside></div>`;
  PF.icons();bind();
}
function form(){
  return `<div class="card-head"><h3>Nova reunião</h3></div><form class="stack" id="f">
    <label class="field"><span>Título da reunião</span><input class="input" name="title" required placeholder="Ex.: Alinhamento de campanha"></label>
    <div class="field"><span>Data e horário</span><div class="row"><input class="input" type="date" name="date" value="${today.toISOString().slice(0,10)}"><input class="input" type="time" name="time" value="09:00" style="width:110px"></div></div>
    <div class="field"><span>Participantes</span><div class="row">${['Sabrina','Lucas Martins','Tiago Dal Molin'].map(n=>PF.avatar(n,'md')).join('')}<button type="button" class="btn btn-ghost btn-sm"><i data-lucide="plus"></i>Adicionar</button></div></div>
    <div class="field"><span>Local da reunião</span><div class="places">${Object.entries(PL).map(([k,[i,l]],n)=>`<label><input type="radio" name="place" value="${k}" ${n===0?'checked':''}><i data-lucide="${i}"></i>${l}</label>`).join('')}</div></div>
    <label class="row small"><input type="checkbox" class="chk" checked name="book">Reservar sala de reunião <span class="muted tiny">(verifica a disponibilidade)</span></label>
    <label class="field"><span>Descrição (opcional)</span><textarea class="input" name="desc" style="min-height:64px" placeholder="Adicione o objetivo da reunião..."></textarea></label>
    <div class="grid g2"><button type="reset" class="btn btn-ghost">Cancelar</button><button class="btn btn-primary">Salvar</button></div></form>`;
}
function bind(){
  content.querySelector('#prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);seed();render();};
  content.querySelector('#next').onclick=()=>{cur.setMonth(cur.getMonth()+1);seed();render();};
  content.querySelector('#today').onclick=()=>{cur=new Date();cur.setDate(1);seed();render();};
  content.querySelector('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const dt=new Date(d.date+'T12:00');events.push({date:dt.toDateString(),time:d.time,title:d.title,place:d.place,n:3,c:'var(--orange)'});cur=new Date(dt.getFullYear(),dt.getMonth(),1);render();PF.toast('Reunião agendada.','ok');};
}
document.getElementById('nm').onclick=()=>content.querySelector('#f input').focus();
seed();render();
</script>
</body>
</html>
