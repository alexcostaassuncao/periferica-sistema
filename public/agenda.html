<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<script src="js/tarefa.js"></script>
<script src="js/reuniao.js"></script>
<style>
  .cal.wk{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .ev{flex-direction:column;align-items:flex-start;gap:2px;padding:5px 7px}
  .cal .ev b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cal .ev small{color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cal .day{cursor:pointer}
  .split{grid-template-columns:1fr 330px}
  @media (max-width:1200px){.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
const esc=PF.esc;
const content=PF.shell({title:'Agenda',subtitle:'Reuniões da equipe e dos clientes. O mesmo registro aparece na Gestão do cliente.',crumbs:[['Agenda']],search:'Buscar reunião ou cliente...',
  actions:`<button class="btn btn-primary" id="nm"><i data-lucide="plus"></i>Nova reunião</button>`});
const COL={online:'var(--blue)',sala:'var(--orange)',estudio:'var(--purple)',cliente:'var(--green)',mesa:'var(--yellow)'};
let cur=new Date();cur.setDate(1);
let M=[],people=[],f={person:'',place:'',client:'',q:'',mine:false};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
async function load(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const from=iso(new Date(y,m,1-7)),to=iso(new Date(y,m+1,7));
  try{[M,people]=await Promise.all([PF.api(`/api/meetings?from=${from}&to=${to}`).then(r=>r.meetings),people.length?people:PF.api('/api/people').then(r=>r.people)]);}catch(e){PF.toast(e.message,'err');}
  render();
}
function render(){
  const y=cur.getFullYear(),m=cur.getMonth(),hoje=iso(new Date());
  const list=M.filter(x=>(!f.person||x.participants.includes(f.person))&&(!f.mine||x.participants.includes(PF.user.id))&&(!f.place||x.place===f.place)&&(!f.client||(f.client==='interna'?!x.client_id:x.client_id===f.client))&&(!f.q||(x.title+' '+(x.client_name||'')).toLowerCase().includes(f.q)));
  const start=new Date(y,m,1);start.setDate(1-start.getDay());
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i>=35&&d.getMonth()!==m)break;const k=iso(d);
    const evs=list.filter(x=>x.date===k);
    cells+=`<div class="day ${d.getMonth()!==m?'out':''} ${k===hoje?'today':''}" data-day="${k}"><span class="num">${d.getDate()}</span>
      ${evs.map(x=>`<div class="ev" style="--c:${COL[x.place]}" data-ev="${x.id}"><b>${x.start_time} ${esc(x.title)}</b><small>${esc(x.client_name||'Interna')} · ${x.participants.length} pessoa(s)</small></div>`).join('')}</div>`;}
  const prox=list.filter(x=>x.date>=hoje).slice(0,8);
  const clients=[...new Map(M.filter(x=>x.client_id).map(x=>[x.client_id,x.client_name])).entries()];
  content.innerHTML=`<div class="split">
    <div class="card">
      <div class="row between wrap mb"><div class="row"><button class="btn btn-ghost" id="today">Hoje</button><button class="icon-btn" id="prev"><i data-lucide="chevron-left"></i></button><button class="icon-btn" id="next"><i data-lucide="chevron-right"></i></button>
        <b style="font-size:15px">${cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}</b></div><span class="muted small">${list.filter(x=>x.date.slice(0,7)===iso(cur).slice(0,7)).length} reunião(ões) no mês</span></div>
      <div class="filters">
        ${PF.select('fp','Participante',[['','Participante: todos'],...people.map(p=>[p.id,p.name])])}
        ${PF.select('fl','Local',[['','Local: todos'],['online','Online (Meet)'],['sala','Sala de Reunião'],['estudio','Estúdio'],['cliente','No cliente'],['mesa','Minha mesa']])}
        ${PF.select('fc','Cliente',[['','Cliente: todos'],['interna','Só internas'],...clients])}
        <label class="row small"><input type="checkbox" class="chk" id="fm" ${f.mine?'checked':''}>Minha agenda</label>
        <a class="link" href="#" id="clr">Limpar filtros</a></div>
      <div class="cal wk">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
      <p class="muted tiny" style="margin-top:8px">Clique num dia vazio para marcar uma reunião; clique numa reunião para editar.</p>
    </div>
    <aside class="stack">
      <div class="card"><div class="card-head"><h3>Próximas reuniões</h3></div>
        ${prox.map(x=>`<div class="li" style="align-items:flex-start"><span class="dot" style="background:${COL[x.place]};margin-top:6px"></span><div class="t"><b style="white-space:normal">${esc(x.title)}</b>
          <span>${x.date.split('-').reverse().join('/')} · ${x.start_time}–${x.end_time} · ${PF.placeLabel(x.place)}${x.client_name?' · '+esc(x.client_name):''}</span>
          <div class="row wrap" style="gap:6px;margin-top:6px;white-space:normal;overflow:visible">${x.meet_url?`<a class="btn btn-primary btn-sm" href="${esc(x.meet_url)}" target="_blank" rel="noopener"><i data-lucide="video"></i>Abrir no Google Meet</a>`:''}<button class="btn btn-ghost btn-sm" data-ev="${x.id}">Editar</button><button class="btn btn-ghost btn-sm" data-ata="${x.id}">${x.has_minutes?'Ata':'Adicionar ata'}</button></div></div></div>`).join('')||'<div class="muted small">Nada marcado.</div>'}</div>
      <div class="card"><div class="card-head"><h3>Locais</h3></div>${Object.entries({online:'Online (Meet)',sala:'Sala de Reunião',estudio:'Estúdio',cliente:'No cliente',mesa:'Minha mesa'}).map(([k,l])=>`<div class="row small" style="margin-bottom:6px"><span class="dot" style="background:${COL[k]}"></span>${l}</div>`).join('')}
        <p class="muted tiny">Sala e Estúdio não aceitam duas reuniões no mesmo horário: o sistema avisa na hora de salvar.</p></div>
    </aside></div>`;
  PF.icons();
  const bind=(i,k)=>{const s=content.querySelector('#'+i);s.value=f[k];s.onchange=()=>{f[k]=s.value;render();};};
  bind('fp','person');bind('fl','place');bind('fc','client');
  content.querySelector('#fm').onchange=e=>{f.mine=e.target.checked;render();};
  content.querySelector('#clr').onclick=e=>{e.preventDefault();f={person:'',place:'',client:'',q:'',mine:false};render();};
  content.querySelector('#prev').onclick=()=>{cur=new Date(y,m-1,1);load();};
  content.querySelector('#next').onclick=()=>{cur=new Date(y,m+1,1);load();};
  content.querySelector('#today').onclick=()=>{cur=new Date();cur.setDate(1);load();};
  content.querySelectorAll('[data-ev]').forEach(e=>e.onclick=async ev=>{ev.stopPropagation();try{const r=await PF.api('/api/meetings?id='+e.dataset.ev);PF.Reuniao.form(r.meeting,{onDone:load});}catch(x){PF.toast(x.message,'err');}});
  content.querySelectorAll('[data-ata]').forEach(e=>e.onclick=()=>PF.Reuniao.ata(e.dataset.ata,{onDone:load}));
  content.querySelectorAll('[data-day]').forEach(d=>d.onclick=()=>PF.Reuniao.form({date:d.dataset.day,participants:PF.user.id?[PF.user.id]:[]},{onDone:load}));
}
document.getElementById('nm').onclick=()=>PF.Reuniao.form({participants:PF.user.id?[PF.user.id]:[]},{onDone:load});
document.getElementById('globalSearch').oninput=e=>{f.q=e.target.value.toLowerCase();render();};
load();
</script>
</body>
</html>
