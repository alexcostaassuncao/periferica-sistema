<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css"><link rel="icon" href="favicon.svg">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;
    background:radial-gradient(900px 500px at 100% 0%,rgba(255,88,11,.22),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(255,88,11,.12),transparent 60%),var(--bg)}
  .box{width:min(420px,100%)}
  .brand{font-family:"Oswald",sans-serif;font-weight:600;font-size:34px;text-align:center;margin-bottom:6px}
  .bar-o{width:44px;height:3px;background:var(--orange);margin:0 auto 26px;border-radius:2px}
  .card{padding:28px}
  h1{font-size:22px;font-weight:800;margin-bottom:4px}
  .stack{gap:16px;margin-top:20px}
  .err{color:#ff7d93;font-size:13px;min-height:18px}
  .btn{width:100%;padding:12px}
</style>
</head>
<body>
<div class="box">
  <div class="brand">PERIFÉRICA</div><div class="bar-o"></div>
  <form class="card" id="f">
    <h1>Entrar no sistema</h1>
    <p class="muted small">Use o email e a senha cadastrados pela direção.</p>
    <div class="stack">
      <label class="field"><span>Email</span><input class="input" type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Senha</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn btn-primary" id="go">Entrar</button>
    </div>
  </form>
</div>
<script>
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const b=document.getElementById('go'),err=document.getElementById('err');
  b.disabled=true;err.textContent='';
  try{
    const fd=new FormData(e.target);
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(fd))});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error||'Não foi possível entrar.');
    const next=new URLSearchParams(location.search).get('next')||'/inicio.html';
    location.href=next.startsWith('/')&&!next.startsWith('//')?next:'/inicio.html';
  }catch(x){err.textContent=x.message;b.disabled=false;}
};
</script>
</body>
</html>
