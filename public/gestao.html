<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .split{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
  .panel{position:sticky;top:20px}
  .panel .head{display:flex;gap:12px;align-items:center;padding-bottom:12px}
  .del{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .del:last-child{border:0}
  .del .lucide{color:var(--orange);width:17px}
  .del small{display:block;color:var(--muted);font-size:11.5px}
  .task{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px}
  .task+.task{margin-top:7px}
  .task small{display:block;color:var(--muted);font-size:11px}
  .day-box{width:52px;height:52px;border-radius:10px;background:var(--panel-3);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
  .day-box b{font-size:20px;line-height:1}.day-box small{font-size:10.5px;color:var(--muted);margin-top:2px}
  .meet{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
  .meet+.meet{margin-top:7px}
  .meet.hl{border-color:var(--orange);background:rgba(255,88,11,.07)}
  .ata h4{font-size:13px;margin:10px 0 6px}
  .ata ul{padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--soft)}
  .new-flag{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--panel)}
  .new-flag .lucide{color:var(--orange);width:28px;height:28px}
  @media (max-width:1200px){.split{grid-template-columns:1fr}.panel{position:static}}
</style>
</head>
<body>
<script>
const id=new URLSearchParams(location.search).get('id');
const content=PF.shell(id?{title:'Clínica Vida+',crumbs:[['Gestão','gestao.html'],['Clínica Vida+']],search:false,actions:`<a class="btn btn-outline" href="agenda.html"><i data-lucide="calendar"></i>Ver no calendário</a>`}:
  {title:'Gestão',subtitle:'Acompanhe os clientes do seu squad e o andamento das entregas.',crumbs:[['Operação'],['Gestão']],search:'Buscar cliente...',
   actions:`<select class="select-in" style="width:auto"><option>C1 – Consultoria</option><option>C2 – Consultoria</option><option>C3 – Consultoria</option></select><a class="btn btn-ghost" href="revisao.html"><i data-lucide="eye"></i>Para minha revisão <span class="badge b-solid-orange">18</span></a>`});
const ST={and:['Em andamento','solid-green'],plan:['Em planejamento','solid-blue'],atr:['Atrasado','solid-amber'],pau:['Pausado','gray']};
const rows=[['Clínica Vida+','Saúde / Estética','Juliana Ferreira',60,'and','Reunião mensal','12/10/2026'],['Mercado Doce','Alimentos','Carla Mendes',30,'plan','Estratégia','15/10/2026'],['Real Pedras','Revestimentos','Juliana Ferreira',75,'and','Apresentação','18/10/2026'],['Elegance Cortinas','Decoração','Ana Luiza',50,'and','Reunião mensal','20/10/2026'],['DZAM Uniformes','Uniformes','Rafael Lima',20,'atr','Reunião mensal','10/10/2026'],['Pet Love','Pet shop','Carla Mendes',15,'plan','Briefing','22/10/2026'],['Solaris Tech','Tecnologia','Juliana Ferreira',90,'and','Entrega de conteúdo','14/10/2026'],['Bella Forma','Academia','Rafael Lima',10,'pau','Reunião mensal','25/10/2026']];
let sel=0;

function list(){
  const r=rows[sel];
  content.innerHTML=`
  <section class="grid g4 mb">
    ${PF.kpi({icon:'users',color:'orange',value:'8',label:'Clientes no squad',sub:'C1 – Consultoria'})}
    ${PF.kpi({icon:'circle-check',color:'green',value:'5',label:'Em andamento'})}
    ${PF.kpi({icon:'pause',color:'blue',value:'2',label:'Em planejamento'})}
    ${PF.kpi({icon:'clock',color:'purple',value:'1',label:'Atrasado'})}
  </section>
  <div class="split">
    <div class="card">
      <div class="filters">${PF.select('a','Status',['Status: Todos','Em andamento','Em planejamento','Atrasado','Pausado'])}${PF.select('b','Responsável',['Responsável: Todos','Juliana Ferreira','Carla Mendes','Ana Luiza','Rafael Lima'])}<span style="margin-left:auto">${PF.demo()}</span></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Squad</th><th>Responsável</th><th>Plano</th><th>Status</th><th>Progresso</th><th>Próxima entrega</th><th></th></tr></thead><tbody>
      ${rows.map((x,i)=>`<tr class="${i===sel?'hl':''}" data-i="${i}" style="cursor:pointer"><td><div class="who">${PF.chip(x[0])}<div><b>${x[0]}</b><small>${x[1]}</small></div></div></td><td>${PF.badge('C1','orange')}</td><td><div class="who">${PF.avatar(x[2],'md')}<div><b class="small">${x[2]}</b><small>Consultora</small></div></div></td><td>Gestão</td><td>${PF.badge(...ST[x[4]])}</td><td><div class="progress"><div class="bar"><span data-w="${x[3]}" style="width:0"></span></div><span class="small">${x[3]}%</span></div></td><td class="small">${x[5]}<br><span class="muted">${x[6]}</span></td><td><a class="icon-btn" href="gestao.html?id=${i}" aria-label="Abrir"><i data-lucide="chevron-right"></i></a></td></tr>`).join('')}
      </tbody></table></div>
      <div class="new-flag"><i data-lucide="user-check"></i><div style="flex:1"><b class="small">Novo cliente entra automaticamente na Gestão</b><div class="muted tiny">após a conclusão do onboarding, já com o squad e a equipe definidos.</div></div><a class="btn btn-ghost btn-sm" href="onboarding.html">Ver onboarding <i data-lucide="chevron-right"></i></a></div>
    </div>
    <aside class="card panel">
      <div class="head">${PF.chip(r[0],'lg')}<div><div class="row"><b style="font-size:17px">${r[0]}</b>${PF.badge(...ST[r[4]])}</div><div class="muted tiny">${r[1]} · Squad C1 · ${r[2]}</div></div></div>
      <div class="tabs" data-tabs><button data-tab="t" class="on">Tarefas</button><button data-tab="p">Plano</button><button data-tab="h">Histórico</button></div>
      <section data-pane="t">
        <div class="card flat mb"><div class="card-head" style="margin-bottom:4px"><h3 class="small">Próximas entregas</h3><a class="link tiny" href="agenda.html">Ver calendário</a></div>
          ${[['Reunião mensal','12/10/2026'],['Relatório de performance','18/10/2026'],['Apresentação de resultados','25/10/2026']].map(([t,d])=>`<div class="del"><i data-lucide="file-text"></i><div style="flex:1">${t}<small>${d}</small></div>${PF.badge('Gestão','orange')}</div>`).join('')}</div>
        <div class="row between small" style="margin-bottom:6px"><b>Tarefas do cliente</b><span class="muted">3 de 8 concluídas</span></div>
        <div class="progress mb"><div class="bar"><span data-w="37" style="width:0"></span></div><span class="small">37%</span></div>
        ${[['Reunião e alinhamento','1/1 Consultora','green',['Juliana']],['Relatório e estratégia','0/1 Copy + Designer','yellow',['Carla Mendes','Djenifer Lima']],['Criação de conteúdo','0/2 Copy','blue',['Carla Mendes']],['Mídia e tráfego','0/1 Tráfego','orange',['Rafael Santos']],['Aprovação e ajustes','0/1 Cliente','pink',['Clínica Vida']]].map(([t,s,c,who])=>`<div class="task"><span class="ico sm c-${c}"><i data-lucide="${c==='green'?'check':'file'}"></i></span><div style="flex:1">${t}<small>${s}</small></div><span class="avatars">${who.map(w=>PF.avatar(w)).join('')}</span></div>`).join('')}
        <a class="btn btn-outline" style="width:100%;margin-top:14px" href="gestao.html?id=${sel}"><i data-lucide="file-text"></i>Ver detalhes do plano</a>
      </section>
      <section data-pane="p" hidden class="empty"><i data-lucide="construction"></i><div>Plano do mês na próxima etapa.</div></section>
      <section data-pane="h" hidden class="empty"><i data-lucide="history"></i><div>Sem histórico ainda.</div></section>
    </aside>
  </div>`;
  PF.icons();PF.animateBars();PF.tabs(content);
  content.querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('a'))return;sel=+tr.dataset.i;list();});
}

function detail(){
  const r=rows[+id]||rows[0];
  document.querySelector('.page-title h1').textContent=r[0];
  content.innerHTML=`
  <div class="card mb"><div class="row between wrap" style="gap:16px">
    <div class="row" style="gap:14px">${PF.chip(r[0],'lg')}<div><div class="row"><h2 style="font-size:22px">${r[0]}</h2>${PF.badge('Em andamento','green')}</div><div class="muted small">${r[1]} · Squad C1 · Consultora: ${r[2]}</div></div></div>
    <div style="min-width:260px"><div class="small muted" style="margin-bottom:6px">Progresso do mês</div><div class="progress"><div class="bar"><span data-w="${r[3]}" style="width:0"></span></div><b>${r[3]}%</b></div></div></div></div>
  <div class="tabs" data-tabs>${['Visão geral','Reuniões e atas','Plano do mês','Tarefas','Campanhas','Social media','Arquivos','Histórico'].map((t,i)=>`<button data-tab="${i}" class="${i===1?'on':''}">${t}</button>`).join('')}</div>
  <section data-pane="1">
    <div class="grid g2 mb">
      <div class="stack">
        <div class="card"><div class="card-head"><h3><i data-lucide="calendar" style="width:17px;vertical-align:-3px"></i> Próxima reunião</h3></div>
          <div class="row" style="gap:14px"><div class="day-box"><b>12</b><small>OUT</small></div><div style="flex:1"><b>Reunião mensal</b><div class="muted small row" style="gap:12px;margin-top:4px"><span><i data-lucide="clock" style="width:14px;vertical-align:-2px"></i> 10:00 às 11:00</span><span><i data-lucide="video" style="width:14px;vertical-align:-2px"></i> Google Meet</span></div></div><button class="btn btn-ghost btn-sm">Editar</button><button class="btn btn-primary btn-sm">Iniciar reunião</button></div></div>
        <div class="card"><div class="card-head"><h3>Últimas reuniões</h3></div>
          ${[['12/10/2026','Reunião mensal',0],['15/09/2026','Onboarding',1],['28/08/2026','Estratégia inicial',1],['10/07/2026','Alinhamento comercial',1]].map(([d,t,ok],i)=>`<div class="meet ${i===0?'hl':''}"><i data-lucide="file-text"></i><span class="muted">${d}</span><b style="flex:1">${t}</b>${ok?'<span style="color:var(--green)" class="small"><i data-lucide="circle-check" style="width:14px;vertical-align:-2px"></i> Ata enviada</span>':'<span style="color:var(--orange)" class="small"><i data-lucide="clock" style="width:14px;vertical-align:-2px"></i> Em breve</span>'}<i data-lucide="chevron-right"></i></div>`).join('')}</div>
      </div>
      <div class="card ata"><div class="card-head"><h3>Ata da reunião</h3><button class="btn btn-ghost btn-sm"><i data-lucide="sparkles"></i>Editar com IA</button></div>
        <div class="tabs"><button class="on">Resumo da ata</button><button>Transcrição</button></div>
        <h4>Principais pontos</h4><ul><li>Cliente quer priorizar captação de novos pacientes.</li><li>Foco inicial em tratamentos faciais e corporais.</li><li>Ações para o mês de outubro: campanha de rejuvenescimento e posts educativos.</li><li>Solicitar fotos da clínica e depoimentos de pacientes.</li><li>Início da campanha na segunda quinzena.</li></ul>
        <h4>Próximos passos</h4><ul><li>Desenvolver planejamento de conteúdo.</li><li>Criar campanha de captação (Meta Ads).</li><li>Preparar materiais para aprovação.</li></ul>
        <div class="grid g2" style="margin-top:16px"><button class="btn btn-ghost"><i data-lucide="download"></i>Baixar ata (PDF)</button><button class="btn btn-primary" onclick="PF.toast('Ata compartilhada com o cliente.','ok')"><i data-lucide="send"></i>Compartilhar com o cliente</button></div></div>
    </div>
    <div class="card"><div class="card-head"><h3>Demandas da reunião</h3><button class="btn btn-primary" id="nd"><i data-lucide="plus"></i>Nova demanda</button></div>
      <div class="tabs"><button class="on">Social media (8)</button><button>Campanhas (2)</button></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th><input type="checkbox" class="chk"></th><th>Descrição</th><th>Tipo</th><th>Responsável</th><th>Prazo</th><th>Status</th><th class="right">Ações</th></tr></thead><tbody id="dem">
      ${[['Post – Dicas de skincare no verão','Carrossel educativo','Social media','Copy','15/10','Em andamento','solid-blue'],['Post – Depoimento de paciente','Imagem + legenda','Social media','Design','16/10','Pendente','solid-red'],['Post – Bastidores da clínica','Reels','Social media','Copy','17/10','Pendente','solid-red'],['Campanha – Rejuvenescimento','Meta Ads','Campanha','Tráfego','20/10','Pendente','solid-red'],['Post – Resultados tratamentos','Carrossel','Social media','Design','21/10','Não iniciado','gray']].map(([t,s,ty,who,d,st,c])=>`<tr><td><input type="checkbox" class="chk"></td><td><b class="small">${t}</b><div class="muted tiny">${s}</div></td><td>${PF.badge(ty,ty==='Campanha'?'pink':'blue')}</td><td><div class="row">${PF.avatar(who)}${who}</div></td><td>${d}</td><td>${PF.badge(st,c)}</td><td class="right"><a class="btn btn-ghost btn-sm" href="${who==='Design'?'design':who==='Copy'?'copy':'trafego'}.html">Ver</a></td></tr>`).join('')}
      </tbody></table></div></div>
  </section>
  ${[0,2,3,4,5,6,7].map(i=>`<section data-pane="${i}" hidden class="card empty"><i data-lucide="construction"></i><div>Esta aba entra na próxima etapa.</div></section>`).join('')}`;
  PF.icons();PF.tabs(content);PF.animateBars();
  content.querySelector('#nd').onclick=()=>{
    const m=PF.modal(`<div class="modal-head"><h3>Nova demanda</h3><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="f"><label class="field"><span>Descrição</span><input class="input" name="t" required placeholder="Post – …"></label>
    <div class="grid g2"><label class="field"><span>Tipo</span><select class="select-in" name="ty"><option>Social media</option><option>Campanha</option></select></label><label class="field"><span>Responsável</span><select class="select-in" name="w"><option>Copy</option><option>Design</option><option>Tráfego</option></select></label></div>
    <label class="field"><span>Prazo</span><input class="input" type="date" name="d" required></label>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Criar e distribuir</button></div></form>`);
    m.el.querySelector('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));content.querySelector('#dem').insertAdjacentHTML('afterbegin',`<tr><td><input type="checkbox" class="chk"></td><td><b class="small">${PF.esc(d.t)}</b></td><td>${PF.badge(d.ty,d.ty==='Campanha'?'pink':'blue')}</td><td><div class="row">${PF.avatar(d.w)}${d.w}</div></td><td>${d.d.split('-').reverse().slice(0,2).join('/')}</td><td>${PF.badge('Não iniciado','gray')}</td><td></td></tr>`);m.close();PF.toast('Demanda enviada para '+d.w+'.','ok');};
  };
}
id!==null?detail():list();
</script>
</body>
</html>
