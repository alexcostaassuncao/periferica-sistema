<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<script src="js/tarefa.js"></script>
<script src="js/reuniao.js"></script>
<script src="js/entregas.js"></script>
<style>
  .day-box{width:52px;height:52px;border-radius:10px;background:var(--panel-3);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
  .day-box b{font-size:20px;line-height:1}.day-box small{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase}
  .meet{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;flex-wrap:wrap}
  .meet+.meet{margin-top:8px}
  .meet.next{border-color:var(--orange);background:rgba(255,88,11,.07)}
  .info{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:13px}
  .info span{color:var(--muted)}
  .tthumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:var(--panel-3)}
</style>
</head>
<body>
<script>
const id=new URLSearchParams(location.search).get('id');
const esc=PF.esc;
const content=PF.shell(id?{title:'Gestão',crumbs:[['Gestão','gestao.html'],['…']],search:false}:
  {title:'Gestão',subtitle:'Clientes da carteira, plano contratado, reuniões e tarefas.',crumbs:[['Operação'],['Gestão']],search:'Buscar cliente...'});
const fdt=d=>d?d.split('-').reverse().join('/'):'—';
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// ---------- LISTA ----------
async function lista(){
  let D={clients:[]},f={squad:'',consultora:'',phase:'gestao',q:''};
  try{D=await PF.api('/api/gestao');}catch(e){PF.toast(e.message,'err');}
  const draw=()=>{
    const list=D.clients.filter(c=>(!f.squad||c.squad===f.squad)&&(!f.consultora||c.consultora_id===f.consultora)&&(!f.phase||c.phase===f.phase)&&(!f.q||c.name.toLowerCase().includes(f.q)));
    const soma=k=>list.reduce((a,c)=>a+Number(c[k]||0),0);
    const consultoras=[...new Map(D.clients.filter(c=>c.consultora_id).map(c=>[c.consultora_id,c.consultora])).entries()];
    content.innerHTML=`
    <section class="grid g4 mb">
      ${PF.kpi({icon:'users',color:'orange',value:String(list.length),label:'Clientes na lista'})}
      ${PF.kpi({icon:'list-todo',color:'blue',value:String(soma('abertas')),label:'Tarefas em andamento'})}
      ${PF.kpi({icon:'alarm-clock',color:'pink',value:String(soma('atrasadas')),label:'Tarefas atrasadas'})}
      ${PF.kpi({icon:'circle-check',color:'green',value:String(soma('aprovadas_mes')),label:'Aprovadas no mês'})}
    </section>
    <div class="card">
      <div class="filters">
        ${PF.select('fPhase','Fase',[['gestao','Em Gestão'],['onboarding','Em onboarding'],['','Todas as fases']])}
        ${PF.select('fSquad','Carteira',[['','Carteira: todas'],['C1','C1'],['C2','C2'],['C3','C3']])}
        ${PF.select('fCons','Consultora',[['','Consultora: todas'],...consultoras])}
        <a class="link" href="#" id="clear">Limpar filtros</a>
      </div>
      ${list.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Carteira</th><th>Consultora</th><th>Plano contratado</th><th>Tarefas</th><th>Atrasadas</th><th>Próxima reunião</th><th></th></tr></thead><tbody>
      ${list.map(c=>{const [dt,tt]=(c.proxima||'').split('|');return `<tr><td><a class="who" href="gestao.html?id=${c.id}">${PF.chip(c.name)}<div><b>${esc(c.name)}</b><small>${esc(c.segment||'—')}${c.phase==='onboarding'?' · em onboarding':''}</small></div></a></td>
        <td>${c.squad?PF.badge(c.squad,'orange'):`<a href="clientes.html?id=${c.id}" title="Definir carteira na ficha do cliente">${PF.badge('Sem carteira','yellow')}</a>`}</td><td>${c.consultora?esc(c.consultora):`<a class="link tiny" href="clientes.html?id=${c.id}">definir</a>`}</td><td>${esc(c.plano||c.services||'—')}${c.plano_valor?`<div class="muted tiny">${esc(c.plano_valor)}</div>`:''}</td>
        <td>${c.abertas}</td><td>${c.atrasadas?PF.badge(String(c.atrasadas),'solid-red'):'0'}</td><td class="small">${dt?fdt(dt.split(' ')[0])+' '+dt.split(' ')[1]+'<div class="muted tiny">'+esc(tt)+'</div>':'—'}</td>
        <td class="right"><a class="btn btn-ghost btn-sm" href="gestao.html?id=${c.id}">Abrir</a></td></tr>`;}).join('')}</tbody></table></div>`
      :`<div class="empty"><i data-lucide="inbox"></i><div>Nenhum cliente com esses filtros. Clientes entram na Gestão quando o onboarding é concluído.<br><span class="tiny">Se um cliente não aparece para você, ele pode estar em outra carteira: verifique com o administrador.</span></div></div>`}
    </div>`;
    PF.icons();
    const bind=(i,k)=>{const s=content.querySelector('#'+i);s.value=f[k];s.onchange=()=>{f[k]=s.value;draw();};};
    bind('fPhase','phase');bind('fSquad','squad');bind('fCons','consultora');
    content.querySelector('#clear').onclick=e=>{e.preventDefault();f={squad:'',consultora:'',phase:'gestao',q:''};document.getElementById('globalSearch').value='';draw();};
  };
  document.getElementById('globalSearch').oninput=e=>{f.q=e.target.value.toLowerCase();draw();};
  draw();
}

// ---------- CLIENTE ----------
async function cliente(){
  let D,M=[],T=[],tab=sessionStorage.getItem('pf-gestao-tab')||'reunioes',tf={stage:'',category:''};
  async function load(){
    try{[D,M,T]=await Promise.all([PF.api('/api/clients/detail?id='+encodeURIComponent(id)),PF.api('/api/meetings?client='+encodeURIComponent(id)).then(r=>r.meetings),PF.api('/api/tasks?client='+encodeURIComponent(id)).then(r=>r.tasks)]);}
    catch(e){content.innerHTML=`<div class="card empty"><i data-lucide="search-x"></i><div>${esc(e.message)}</div><a class="btn btn-ghost" href="gestao.html" style="margin-top:12px">Voltar para a Gestão</a></div>`;PF.icons();return;}
    draw();
  }
  function draw(){
    const c=D.client;
    document.title='Periférica · Gestão · '+c.name;
    document.querySelector('.crumbs').innerHTML=`<a href="gestao.html">Gestão</a><i data-lucide="chevron-right"></i><span>${esc(c.name)}</span>`;
    document.querySelector('.page-title h1').innerHTML=`<a href="gestao.html" class="icon-btn" title="Voltar para a Gestão" style="display:inline-grid;vertical-align:-4px;margin-right:4px"><i data-lucide="arrow-left"></i></a>${esc(c.name)}`;
    const abertas=T.filter(t=>t.stage!=='aprovada').length,feitas=T.filter(t=>t.stage==='aprovada').length;
    content.innerHTML=`
    <div class="card mb"><div class="row between wrap" style="gap:16px">
      <div class="row" style="gap:14px">${PF.chip(c.name,'lg')}<div><div class="row"><h2 style="font-size:22px">${esc(c.name)}</h2>${PF.badge(c.phase==='gestao'?'Em Gestão':c.phase==='onboarding'?'Em onboarding':'Aguardando',c.phase==='gestao'?'green':'blue')}</div>
        <div class="muted small">${esc(c.segment||'—')}${c.squad?' · Carteira '+c.squad:''} · Consultora: ${esc((D.team.find(t=>t.role==='consultora')||{}).name||'—')}</div>
        <a class="link tiny" href="clientes.html?id=${c.id}">Abrir ficha completa do cliente</a></div></div>
      <div class="row" style="gap:18px"><div><div class="muted tiny">Tarefas em andamento</div><b style="font-size:20px">${abertas}</b></div><div><div class="muted tiny">Aprovadas</div><b style="font-size:20px">${feitas}</b></div></div>
    </div></div>
    ${!c.squad||!D.team.find(t=>t.role==='consultora'&&t.user_id)?`<div class="note mb"><i data-lucide="triangle-alert"></i><div>Este cliente ainda está sem ${!c.squad?'<b>carteira</b>':''}${!c.squad&&!D.team.find(t=>t.role==='consultora'&&t.user_id)?' e sem ':''}${!D.team.find(t=>t.role==='consultora'&&t.user_id)?'<b>consultora</b>':''}. <a class="link" href="clientes.html?id=${c.id}">Definir na ficha do cliente → aba Equipe</a></div></div>`:''}
    <div class="tabs">${[['geral','Visão geral'],['reunioes','Reuniões e atas'],['tarefas','Tarefas ('+T.length+')'],['historico','Histórico']].map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>
    <div id="pane"></div>`;
    const p=content.querySelector('#pane');
    ({geral,reunioes,tarefas,historico})[tab](p);
    PF.icons();
    content.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sessionStorage.setItem('pf-gestao-tab',tab);draw();});
  }
  function geral(p){
    const assin=D.contracts.filter(k=>k.status==='assin');
    const plano=assin[0];let pd={};try{pd=JSON.parse(plano?.data||'{}');}catch{}
    p.innerHTML=`<div class="grid g2">
      <div class="card"><div class="card-head"><h3>Plano contratado</h3>${plano?`<a class="link tiny" href="/api/contracts/pdf?id=${plano.id}" target="_blank" rel="noopener">Ver contrato</a>`:''}</div>
        ${plano?`<div class="info"><span>Plano</span><b>${esc(plano.model)}</b><span>Modalidade</span><b>${esc(pd.modalidade||plano.term||'—')}</b><span>Valor</span><b>${esc(plano.value||'—')}</b>
          <span>Vigência</span><b>${pd.inicio?fdt(pd.inicio)+' a '+fdt(pd.termino):'—'}</b><span>Assinado em</span><b>${new Date(plano.signed_at).toLocaleDateString('pt-BR')}</b></div>
          ${pd.itens_plano?`<details style="margin-top:12px"><summary class="link small">Texto completo do plano (contrato)</summary><div class="small muted" style="white-space:pre-wrap;margin-top:8px;line-height:1.5">${esc(pd.itens_plano)}</div></details>`:''}`
          :'<div class="muted small">Nenhum contrato assinado ligado a este cliente.</div>'}</div>
      <div class="card"><div class="card-head"><h3>Equipe</h3></div>${D.team.map(t=>`<div class="li"><div class="t"><span>${t.label}</span><b>${esc(t.name||'—')}</b></div></div>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:14px"><div class="card-head"><div><h3>O que o plano inclui</h3><p>Total previsto no mês. Entregas semanais são multiplicadas pelas semanas de produção do mês; as mensais ficam fixas.</p></div>
      <a class="btn btn-ghost btn-sm" href="clientes.html?id=${id}" onclick="sessionStorage.setItem('pf-ficha-tab','servicos')"><i data-lucide="pencil"></i>Editar entregas</a></div>
      <div id="entMes"></div></div>`;
    PF.Entregas.mes(p.querySelector('#entMes'),id,{editHref:'clientes.html?id='+id});
  }
  function reunioes(p){
    const hoje=new Date().toISOString().slice(0,10);
    const prox=M.filter(m=>m.date>=hoje),pass=M.filter(m=>m.date<hoje).reverse(),next=prox[0];
    const row=(m,isNext)=>`<div class="meet ${isNext?'next':''}"><i data-lucide="calendar"></i><span class="muted">${fdt(m.date)} · ${m.start_time}</span><b style="flex:1;min-width:160px">${esc(m.title)}</b>
      ${m.has_minutes?'<span class="small" style="color:var(--green)"><i data-lucide="circle-check" style="width:14px;vertical-align:-2px"></i> Ata</span>':''}${m.files?`<span class="muted tiny">${m.files} anexo(s)</span>`:''}
      ${m.meet_url?`<a class="btn btn-ghost btn-sm" href="${esc(m.meet_url)}" target="_blank" rel="noopener"><i data-lucide="video"></i>Abrir no Google Meet</a>`:''}
      <button class="btn btn-ghost btn-sm" data-ata="${m.id}"><i data-lucide="file-text"></i>${m.has_minutes?'Editar ata':'Adicionar ata'}</button>
      <button class="btn btn-ghost btn-sm" data-nt="${m.id}"><i data-lucide="plus"></i>Tarefa</button>
      <button class="icon-btn" data-ed="${m.id}" title="Editar reunião"><i data-lucide="pencil"></i></button></div>`;
    p.innerHTML=`<div class="grid g2">
      <div class="card"><div class="card-head"><h3>Próxima reunião</h3><button class="btn btn-primary btn-sm" id="nm"><i data-lucide="plus"></i>Nova reunião</button></div>
        ${next?`<div class="row" style="gap:14px"><div class="day-box"><b>${next.date.slice(8)}</b><small>${MES[+next.date.slice(5,7)-1]}</small></div><div style="flex:1"><b>${esc(next.title)}</b>
          <div class="muted small">${next.start_time} às ${next.end_time} · ${PF.placeLabel(next.place)} · ${next.participants.length} participante(s)</div></div>
          ${next.meet_url?`<a class="btn btn-primary btn-sm" href="${esc(next.meet_url)}" target="_blank" rel="noopener"><i data-lucide="video"></i>Abrir no Google Meet</a>`:''}<button class="btn btn-ghost btn-sm" data-ed="${next.id}">Editar</button></div>`
        :'<div class="muted small">Nenhuma reunião marcada.</div>'}
        ${prox.length>1?'<div style="margin-top:12px">'+prox.slice(1).map(m=>row(m)).join('')+'</div>':''}</div>
      <div class="card"><div class="card-head"><h3>Reuniões anteriores e atas</h3></div>${pass.map(m=>row(m)).join('')||'<div class="muted small">Nenhuma ainda.</div>'}</div>
    </div>`;
    p.querySelector('#nm').onclick=()=>PF.Reuniao.form({client_id:id},{onDone:load});
    p.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{const r=await PF.api('/api/meetings?id='+b.dataset.ed);PF.Reuniao.form(r.meeting,{onDone:load});});
    p.querySelectorAll('[data-ata]').forEach(b=>b.onclick=()=>PF.Reuniao.ata(b.dataset.ata,{onDone:load}));
    p.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>PF.Tarefa.nova({client_id:id,meeting_id:b.dataset.nt,meetings:M,onDone:load}));
  }
  function tarefas(p){
    const list=T.filter(t=>(!tf.stage||t.stage===tf.stage)&&(!tf.category||t.category===tf.category));
    const {CAT,FMT,STAGES}=PF.taskMeta;
    const nCat=k=>T.filter(t=>(!tf.stage||t.stage===tf.stage)&&(!k||t.category===k)).length;
    p.innerHTML=`<div class="card"><div class="card-head"><div><h3>Tarefas do cliente</h3><p>A Gestão acompanha a tarefa em todas as etapas.</p></div>
        <div class="row" style="gap:8px"><button class="btn btn-ghost" id="gm"><i data-lucide="wand-sparkles"></i>Gerar tarefas do mês</button><button class="btn btn-primary" id="nt"><i data-lucide="plus"></i>Nova tarefa</button></div></div>
      <div class="tabs" style="margin-top:4px">${[['','Todas'],...Object.entries(CAT)].map(([k,l])=>`<button data-cat="${k}" class="${tf.category===k?'on':''}">${l}<span class="count">${nCat(k)}</span></button>`).join('')}</div>
      <div class="filters">${PF.select('fs','Etapa',[['','Etapa: todas'],...STAGES])}<a class="link" href="#" id="clr">Limpar</a><span class="muted small" style="margin-left:auto">${list.length} de ${T.length}</span></div>
      ${list.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Tarefa</th><th>Etapa</th><th>Com</th><th>Categoria</th><th>Formato</th><th>Prazo</th><th></th></tr></thead><tbody>
      ${list.map(t=>`<tr><td><div class="who">${t.last_url?(t.last_kind==='video'?'<span class="tthumb" style="display:grid;place-items:center"><i data-lucide="film"></i></span>':`<img class="tthumb" src="${esc(t.last_url)}" alt="">`):'<span class="tthumb" style="display:grid;place-items:center"><i data-lucide="file"></i></span>'}<div><b>${esc(t.title)}</b><small>${t.versions} versão(ões) · ${t.comments} comentário(s)</small></div></div></td>
        <td>${PF.taskStage(t.stage)}${t.client_status==='ajustes'?'<div class="tiny" style="color:var(--pink)">cliente pediu ajustes</div>':''}</td><td class="small">${esc(t.assignee_name||'—')}</td><td>${CAT[t.category]}</td><td>${FMT[t.format]}</td>
        <td class="small" style="color:${t.due_date&&t.due_date<new Date().toISOString().slice(0,10)&&t.stage!=='aprovada'?'var(--pink)':'inherit'}">${fdt(t.due_date)}</td>
        <td class="right"><button class="btn btn-ghost btn-sm" data-open="${t.id}">Ver tarefa</button></td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty"><i data-lucide="list-todo"></i><div>Nenhuma tarefa com esses filtros.</div></div>'}</div>`;
    const fs=p.querySelector('#fs');fs.value=tf.stage;
    fs.onchange=()=>{tf.stage=fs.value;tarefas(p);PF.icons();};
    p.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{tf.category=b.dataset.cat;tarefas(p);PF.icons();});
    p.querySelector('#clr').onclick=e=>{e.preventDefault();tf={stage:'',category:''};tarefas(p);PF.icons();};
    p.querySelector('#nt').onclick=()=>PF.Tarefa.nova({client_id:id,meetings:M,onDone:load});
    p.querySelector('#gm').onclick=()=>gerarMes();
    p.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>PF.Tarefa.open(b.dataset.open,{onChange:load}));
  }
  // Gera de uma vez as tarefas que o plano pede no mês (só as que faltam); depois o gestor edita uma por uma.
  function gerarMes(){
    let month=sessionStorage.getItem('pf-ent-mes')||new Date().toISOString().slice(0,7);
    const m=PF.modal(`<div class="modal-head"><div><h3>Gerar tarefas do mês</h3><p class="muted small">Cria as tarefas que o plano inclui, já com categoria, formato e prazo sugerido. Depois é só editar cada uma.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
      <label class="field" style="max-width:220px"><span>Mês</span><input class="input" type="month" id="gmM" value="${month}"></label>
      <div id="gmP" style="margin-top:14px"></div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="gmGo" disabled><i data-lucide="wand-sparkles"></i>Gerar tarefas</button></div>`,{side:true});
    const box=m.el.querySelector('#gmP'),go=m.el.querySelector('#gmGo');let falta=0;
    async function prev(){
      box.innerHTML='<p class="muted small">Calculando…</p>';go.disabled=true;
      try{
        const P=await PF.api(`/api/tasks/plano?client=${encodeURIComponent(id)}&month=${month}`);
        falta=P.rows.reduce((s,r)=>s+r.create,0);
        box.innerHTML=P.rows.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Categoria</th><th>Conta</th><th class="right">Plano</th><th class="right">Já existem</th><th class="right">Serão criadas</th></tr></thead><tbody>
          ${P.rows.map(r=>`<tr><td><b>${r.label}</b></td><td class="small muted">${r.conta}</td><td class="right">${r.total}</td><td class="right">${r.existing}</td><td class="right"><b>${r.create}</b></td></tr>`).join('')}</tbody></table></div>
          <p class="muted tiny" style="margin-top:8px">${P.weeks} semanas de produção. ${falta?`Serão criadas <b>${falta}</b> tarefas na etapa Gestão, com prazo na sexta-feira de cada semana.`:'As tarefas deste mês já foram todas geradas.'}</p>`
          :`<div class="empty" style="padding:18px"><i data-lucide="package-open"></i><div>O plano deste cliente ainda não tem entregas definidas.</div><a class="btn btn-ghost btn-sm" href="clientes.html?id=${id}" onclick="sessionStorage.setItem('pf-ficha-tab','servicos')" style="margin-top:10px">Definir entregas</a></div>`;
        go.disabled=!falta;PF.icons();
      }catch(e){box.innerHTML=`<p class="muted small">${esc(e.message)}</p>`;}
    }
    m.el.querySelector('#gmM').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;prev();}};
    go.onclick=async()=>{go.disabled=true;
      try{const r=await PF.api('/api/tasks/plano',{method:'POST',body:{client_id:id,month}});m.close();PF.toast(r.created?`${r.created} tarefas criadas. Agora é só editar cada uma.`:r.message,'ok');tab='tarefas';load();}
      catch(e){PF.toast(e.message,'err');go.disabled=false;}};
    PF.icons();prev();
  }
  function historico(p){
    const K={contato:['phone','blue'],reuniao:['users','purple'],nota:['sticky-note','yellow'],sistema:['bot','gray']};
    p.innerHTML=`<div class="card"><div class="card-head"><h3>Histórico do cliente</h3><a class="link tiny" href="clientes.html?id=${id}">Registrar contato na ficha</a></div>
      ${D.events.map(e=>`<div class="li" style="align-items:flex-start"><span class="ico sm c-${K[e.kind][1]}"><i data-lucide="${K[e.kind][0]}"></i></span><div class="t"><b style="white-space:normal">${esc(e.title)}</b><span>${new Date(e.happened_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} · ${esc(e.author_name)}</span>${e.body?`<div class="small" style="white-space:pre-wrap;margin-top:3px;color:var(--soft)">${esc(e.body)}</div>`:''}</div></div>`).join('')||'<div class="muted small">Nada registrado.</div>'}</div>`;
  }
  load();
}
id?cliente():lista();
</script>
</body>
</html>
