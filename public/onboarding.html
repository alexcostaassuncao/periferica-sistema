<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .stepn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--panel-3);border:2px solid var(--line-2)}
  .stepn.done{background:var(--green);border-color:var(--green);color:#04130d}
  .stepn.now{background:rgba(255,88,11,.25);border-color:var(--orange)}
  .check{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px}
  .check+.check{margin-top:8px}
  .check .head{display:grid;grid-template-columns:40px 1.6fr 1fr 110px 130px;gap:14px;align-items:center;cursor:pointer}
  .check b{font-size:13.5px}.check p{font-size:12px;color:var(--muted);margin-top:2px}
  .check .sub{border-top:1px solid var(--line);margin-top:12px;padding-top:8px;display:none}
  .check.open .sub{display:block}
  .item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:13px}
  .item+.item{border-top:1px dashed var(--line)}
  .item.ok .lbl{color:var(--dim);text-decoration:line-through}
  .item small{color:var(--muted);font-size:11.5px}
  .item .note-in{grid-column:2/-1;padding:6px 10px;font-size:12.5px}
  .countdown{display:flex;align-items:center;gap:12px;border:1px solid rgba(255,88,11,.5);background:rgba(255,88,11,.1);border-radius:12px;padding:12px 16px}
  .countdown .lucide{color:var(--orange);width:28px;height:28px}
  .countdown b{font-size:18px;display:block}.countdown small{color:var(--muted);font-size:12px}
  .gate{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  @media (max-width:980px){.check .head{grid-template-columns:40px 1fr}.check .head>:nth-child(n+3){grid-column:2}}
</style>
</head>
<body>
<script>
const id=new URLSearchParams(location.search).get('id');
const content=PF.shell(id?{title:'Onboarding',crumbs:[['Onboarding','onboarding.html'],['…']],search:false}:
  {title:'Onboarding',subtitle:'Ativação dos novos clientes (prazo de 10 dias úteis).',crumbs:[['Operação'],['Onboarding']],search:'Buscar cliente...'});
const esc=PF.esc;
const diasUteis=(from,to)=>{let n=0;const d=new Date(from);d.setHours(0,0,0,0);const end=new Date(to);end.setHours(0,0,0,0);const sign=end>=d?1:-1;
  while(d.toDateString()!==end.toDateString()){d.setDate(d.getDate()+sign);const w=d.getDay();if(w&&w!==6)n+=sign;}return n;};
const bar=p=>`<div class="progress"><div class="bar"><span data-w="${p}" style="width:0;background:${p>=100?'var(--green)':p<25?'var(--pink)':'var(--orange)'}"></span></div><span class="small">${p}%</span></div>`;

// ---------- LISTA ----------
async function lista(){
  let D={onboardings:[],waiting:[]},q='',tab='andamento';
  try{D=await PF.api('/api/onboarding');}catch(e){PF.toast(e.message,'err');}
  const draw=()=>{
    const and=D.onboardings.filter(o=>o.status==='andamento'),conc=D.onboardings.filter(o=>o.status==='concluido');
    const atrasados=and.filter(o=>o.due_at<Date.now());
    const media=conc.length?Math.round(conc.reduce((a,o)=>a+diasUteis(o.started_at,o.finished_at),0)/conc.length):null;
    const match=o=>!q||(o.client_name||o.name).toLowerCase().includes(q);
    const list=(tab==='andamento'?and:tab==='concluido'?conc:[]).filter(match);
    content.innerHTML=`
    <section class="grid g4 mb">
      ${PF.kpi({icon:'users',color:'orange',value:String(and.length),label:'Em onboarding',click:'andamento',active:tab==='andamento'})}
      ${PF.kpi({icon:'hourglass',color:'yellow',value:String(D.waiting.length),label:'Aguardando início',click:'aguardando',active:tab==='aguardando'})}
      ${PF.kpi({icon:'alarm-clock',color:'pink',value:String(atrasados.length),label:'Passaram do prazo'})}
      ${PF.kpi({icon:'clock',color:'green',value:media===null?'—':media+' dias úteis',label:'Média de ativação',click:'concluido',active:tab==='concluido'})}
    </section>
    <div class="note info mb"><i data-lucide="info"></i><div>O <b>progresso</b> é a quantidade de itens do checklist já marcados, dividida pelo total. É a mesma conta em todas as telas.</div></div>
    <div class="card">
      <div class="tabs">${[['andamento','Em andamento',and.length],['aguardando','Aguardando início',D.waiting.length],['concluido','Enviados para Gestão',conc.length]].map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}<span class="count">${n}</span></button>`).join('')}</div>
      ${tab==='aguardando'?(D.waiting.filter(match).length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Serviços</th><th>Carteira</th><th>Cliente desde</th><th></th></tr></thead><tbody>
        ${D.waiting.filter(match).map(c=>`<tr><td><a class="who" href="clientes.html?id=${c.id}">${PF.chip(c.name)}<div><b>${esc(c.name)}</b><small>${esc(c.segment||'—')}</small></div></a></td><td>${esc(c.services||'—')}</td><td>${c.squad||'—'}</td><td>${new Date(c.created_at).toLocaleDateString('pt-BR')}</td>
          <td class="right"><button class="btn btn-primary btn-sm" data-start="${c.id}" data-name="${esc(c.name)}"><i data-lucide="play"></i>Iniciar onboarding</button></td></tr>`).join('')}</tbody></table></div>`
        :`<div class="empty"><i data-lucide="check-circle"></i><div>Nenhum cliente esperando. Clientes novos aparecem aqui quando o contrato é assinado.</div></div>`)
      :list.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Serviços</th><th>Carteira</th><th>Consultora</th><th>Início</th><th>${tab==='concluido'?'Concluído':'Prazo'}</th><th>Progresso</th><th></th></tr></thead><tbody>
        ${list.map(o=>{const late=o.status==='andamento'&&o.due_at<Date.now();return `<tr><td><div class="who">${PF.chip(o.client_name)}<div><b>${esc(o.client_name)}</b><small>${esc(o.segment||'—')}</small></div></div></td>
          <td>${esc(o.services||'—')}</td><td>${o.squad||'—'}</td><td>${esc(o.consultora||'—')}</td><td>${new Date(o.started_at).toLocaleDateString('pt-BR')}</td>
          <td>${o.status==='concluido'?new Date(o.finished_at).toLocaleDateString('pt-BR'):`<span style="color:${late?'var(--pink)':'inherit'}">${new Date(o.due_at).toLocaleDateString('pt-BR')}${late?' (atrasado)':''}</span>`}</td>
          <td>${bar(o.progress.pct)}<small class="muted">${o.progress.done} de ${o.progress.total} itens</small></td>
          <td class="right"><a class="btn btn-ghost btn-sm" href="onboarding.html?id=${o.id}">Abrir</a></td></tr>`;}).join('')}</tbody></table></div>`
      :`<div class="empty"><i data-lucide="list-checks"></i><div>${tab==='andamento'?'Nenhum onboarding em andamento. Veja a aba "Aguardando início".':'Nenhum onboarding concluído ainda.'}</div></div>`}
    </div>`;
    PF.icons();PF.animateBars();
    content.querySelectorAll('[data-t],[data-kpi]').forEach(b=>b.onclick=()=>{tab=b.dataset.t||b.dataset.kpi;draw();});
    content.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{
      if(!confirm(`Iniciar o onboarding de ${b.dataset.name}? O prazo é de 10 dias úteis a partir de hoje.`))return;
      try{const r=await PF.api('/api/onboarding',{method:'POST',body:{client_id:b.dataset.start}});location.href='onboarding.html?id='+r.id;}catch(e){PF.toast(e.message,'err');}
    });
  };
  document.getElementById('globalSearch').oninput=e=>{q=e.target.value.toLowerCase();draw();};
  draw();
}

// ---------- DETALHE (checklist) ----------
async function detalhe(){
  let D,open=null;
  async function load(){
    try{D=await PF.api('/api/onboarding?id='+encodeURIComponent(id));}
    catch(e){content.innerHTML=`<div class="card empty"><i data-lucide="search-x"></i><div>${esc(e.message)}</div><a class="btn btn-ghost" href="onboarding.html" style="margin-top:12px">Voltar</a></div>`;PF.icons();return;}
    draw();
  }
  function draw(){
    const o=D.onboarding,fechado=o.status==='concluido';
    document.title='Periférica · Onboarding · '+o.client_name;
    document.querySelector('.crumbs').innerHTML=`<a href="onboarding.html">Onboarding</a><i data-lucide="chevron-right"></i><span>${esc(o.client_name)}</span>`;
    document.querySelector('.page-title h1').innerHTML=`<a href="onboarding.html" class="icon-btn" title="Voltar" style="display:inline-grid;vertical-align:-4px;margin-right:4px"><i data-lucide="arrow-left"></i></a>${esc(o.client_name)}`;
    const faltam=diasUteis(Date.now(),o.due_at);
    if(open===null){const cur=D.steps.findIndex(s=>!s.done);open=cur<0?D.steps.length-1:cur;}
    content.innerHTML=`
    <div class="card mb"><div class="row between wrap" style="gap:18px">
      <div class="row" style="gap:14px">${PF.chip(o.client_name,'lg')}<div><div class="row"><h2 style="font-size:22px">${esc(o.client_name)}</h2>${PF.badge(fechado?'Enviado para Gestão':'Em andamento',fechado?'green':'blue')}</div>
        <div class="muted small" style="margin-top:4px">${esc(o.segment||'—')}${o.squad?' · Carteira '+o.squad:''} · Início ${new Date(o.started_at).toLocaleDateString('pt-BR')} por ${esc(o.started_by||'—')} · Prazo ${new Date(o.due_at).toLocaleDateString('pt-BR')}</div>
        <a class="link tiny" href="clientes.html?id=${o.client_id}">Abrir ficha do cliente</a></div></div>
      <div style="min-width:240px;flex:1;max-width:380px"><div class="small muted" style="margin-bottom:6px">Progresso geral · ${o.progress.done} de ${o.progress.total} itens</div>${bar(o.progress.pct)}</div>
      ${fechado?`<div class="countdown" style="border-color:rgba(31,213,154,.5);background:rgba(31,213,154,.1)"><i data-lucide="check-circle" style="color:var(--green)"></i><div><small>Concluído em</small><b>${new Date(o.finished_at).toLocaleDateString('pt-BR')}</b></div></div>`
        :`<div class="countdown"><i data-lucide="calendar-clock"></i><div><small>${faltam>=0?'Faltam':'Atrasado há'}</small><b>${Math.abs(faltam)} dia${Math.abs(faltam)===1?'':'s'} út${Math.abs(faltam)===1?'il':'eis'}</b></div></div>`}
    </div></div>
    ${D.steps.map((s,i)=>{const done=s.items.filter(x=>x.done).length;const st=s.done?'Concluído':s.started?'Em andamento':'Pendente';
      return `<div class="check ${open===i?'open':''}" data-step="${i}">
      <div class="head" data-toggle="${i}"><span class="stepn ${s.done?'done':s.started?'now':''}">${s.done?'<i data-lucide="check" style="width:16px"></i>':i+1}</span>
        <div><b>${esc(s.title)}</b><p>${esc(s.desc)}</p></div>
        <div class="row small">${s.responsible?PF.avatar(s.responsible)+esc(s.responsible):`<span class="muted">${esc(s.roleLabel||'')} (definir na ficha)</span>`}</div>
        <div class="small">${esc(s.prazo)}</div>
        <div class="row" style="justify-content:space-between">${PF.badge(st,s.done?'solid-green':s.started?'solid-blue':'gray')}<span class="muted tiny">${done}/${s.items.length}</span></div></div>
      <div class="sub">${s.items.map(it=>`<div class="item ${it.done?'ok':''}">
          <input type="checkbox" class="chk" data-item="${it.id}" ${it.done?'checked':''} ${fechado?'disabled':''}>
          <div><div class="lbl">${esc(it.label)}</div>${it.done?`<small>Feito por ${esc(it.done_by)} em ${new Date(it.done_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small>`:''}</div>
          <button class="icon-btn" data-note="${it.id}" title="Anotação"><i data-lucide="${it.notes?'message-square-text':'message-square-plus'}"></i></button>
          ${it.notes?`<div class="note-in muted">${esc(it.notes)}</div>`:''}
        </div>`).join('')}</div>
    </div>`;}).join('')}
    <div class="card" style="margin-top:14px"><div class="gate">
      <i data-lucide="${fechado?'check-circle':D.readyForGestao?'unlock':'lock'}" style="width:26px;height:26px;color:${fechado||D.readyForGestao?'var(--green)':'var(--muted)'}"></i>
      <div style="flex:1;min-width:240px"><b>${fechado?'Cliente já está na Gestão.':'Enviar para Gestão'}</b>
        <div class="muted small">${fechado?'O onboarding foi concluído.':D.readyForGestao?'Apresentação e alinhamentos concluídos. Pode liberar o cliente para a rotina de Gestão.':'Libera quando as etapas '+D.requiredSteps.map(x=>'"'+esc(x)+'"').join(' e ')+' estiverem 100% marcadas.'}</div></div>
      ${fechado?`<a class="btn btn-ghost" href="gestao.html">Ir para Gestão</a>`:`<button class="btn btn-primary" id="send" ${D.readyForGestao?'':'disabled'}><i data-lucide="send"></i>Enviar para Gestão</button>`}
    </div></div>`;
    PF.icons();PF.animateBars();
    content.querySelectorAll('[data-toggle]').forEach(h=>h.onclick=()=>{const i=+h.dataset.toggle;open=open===i?-1:i;draw();});
    content.querySelectorAll('[data-item]').forEach(c=>c.onchange=async()=>{
      c.disabled=true;
      try{await PF.api('/api/onboarding',{method:'PATCH',body:{item_id:c.dataset.item,done:c.checked}});await load();}
      catch(e){PF.toast(e.message,'err');c.checked=!c.checked;c.disabled=false;}
    });
    content.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{
      const it=D.steps.flatMap(s=>s.items).find(x=>x.id===b.dataset.note);
      const m=PF.modal(`<div class="modal-head"><h3>Anotação</h3><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
        <form class="stack" id="f"><p class="small muted">${esc(it.label)}</p><textarea class="input" name="notes" placeholder="Ex.: cliente vai mandar as fotos na quinta">${esc(it.notes||'')}</textarea>
        <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Salvar</button></div></form>`);
      m.el.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{await PF.api('/api/onboarding',{method:'PATCH',body:{item_id:it.id,notes:e.target.elements.notes.value}});m.close();PF.toast('Anotação salva.','ok');load();}catch(x){PF.toast(x.message,'err');}};
    });
    const send=content.querySelector('#send');if(send)send.onclick=async()=>{
      if(!confirm(`Enviar ${o.client_name} para a Gestão? O onboarding será encerrado.`))return;
      try{await PF.api('/api/onboarding',{method:'PATCH',body:{id:o.id,action:'send_gestao'}});PF.toast('Cliente enviado para a Gestão!','ok');load();}catch(e){PF.toast(e.message,'err');}
    };
  }
  load();
}
id?detalhe():lista();
</script>
</body>
</html>
