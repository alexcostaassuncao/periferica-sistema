<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<script src="js/contrato-form.js"></script>
<style>
  .col-head{border-radius:8px;border-bottom:0;padding:9px 10px;background:color-mix(in srgb,var(--c) 22%,transparent)}
  .kcard .src{align-self:flex-start}
  .kcard .contact{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:12.5px}
  .kcard .contact .lucide{width:14px;height:14px;color:var(--muted)}
  .kcard .acts{display:flex;align-items:center;gap:6px}
  .wa{display:inline-flex;align-items:center;gap:5px;background:rgba(37,211,102,.15);color:#3ee07f;border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600}
  .wa .lucide{width:13px;height:13px}
  .kcard .acts .icon-btn{width:26px;height:26px}
  .kcard .acts .icon-btn .lucide{width:15px}
  .kcard .owner{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--soft);padding-top:7px;border-top:1px solid var(--line)}
  .kcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .kcard .top small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .kcard .gen{width:100%}
  .info-cards .card{display:flex;flex-direction:column;gap:10px}
  .info-cards .card ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13px;background:rgba(0,0,0,.2);border-radius:10px;padding:12px}
  .info-cards .card li{display:flex;gap:9px;align-items:center}
  .info-cards .card li .lucide{width:16px}
  .t-wait{background:linear-gradient(180deg,rgba(246,181,30,.13),var(--panel))}
  .t-arch{background:linear-gradient(180deg,rgba(244,63,94,.13),var(--panel))}
  .t-hist{background:linear-gradient(180deg,rgba(31,213,154,.12),var(--panel))}
  .empty-col{color:var(--dim);font-size:12px;text-align:center;padding:16px 4px}
  .attr-divider{display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
  .report-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .report-table th,.report-table td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  .report-table th{color:var(--muted);font-weight:600}
  .crm-dashboard{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .crm-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .crm-kpi{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:80px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);cursor:pointer}
  .crm-kpi:hover,.crm-kpi.on{border-color:var(--orange);background:rgba(255,88,11,.08)}
  .crm-kpi small{color:var(--muted);font-size:11px}
  .crm-kpi b{font-size:21px}
  .crm-kpi .amount{font-size:13px;color:var(--soft)}
  .crm-dash-row{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
  .crm-products{padding:12px}
  .crm-products .report-table td:last-child,.crm-products .report-table th:last-child{text-align:right}
  .crm-filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:12px 0 8px}
  .crm-filters .field{min-width:0}
  .crm-detail{padding:14px;border-color:var(--orange)}
  .crm-sub>td{background:var(--panel-3);padding:10px 12px !important}
  .crm-sub .report-table{font-size:12px}
  .crm-top{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:12px;margin-bottom:12px;align-items:stretch}
  .crm-bar{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .crm-bar-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crm-bar-acts{margin-left:auto;display:flex;align-items:center;gap:8px}
  .crm-bar-fields{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crm-bar-fields .input,.crm-bar-fields .select-in{height:38px;padding-top:6px;padding-bottom:6px;font-size:13px}
  .crm-bar-fields input[type=date]{width:150px}
  .crm-bar-fields .select-in{width:auto;min-width:140px;max-width:180px;flex:1}
  @media(max-width:1100px){.crm-top{grid-template-columns:1fr}}
  .crm-filter-dates{display:contents}
  .crm-product-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr) auto;align-items:end;gap:8px}
  .crm-product-row [data-remove-product]{justify-self:end}
  .crm-product-row .field{min-width:0}
  .crm-contract-list{display:flex;flex-direction:column;gap:8px}
  .crm-contract-item{padding:10px;border:1px solid var(--line);border-radius:9px}
  .crm-contract-item .top{display:flex;justify-content:space-between;gap:8px}
  .crm-alert{border-color:rgba(246,181,30,.4);background:rgba(246,181,30,.08)}
  @media(max-width:1000px){.crm-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:650px){.crm-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.crm-dash-row{grid-template-columns:1fr}.crm-product-row{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}.crm-filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script>
const content=PF.shell({title:'Comercial',subtitle:'Gestão de leads e oportunidades',crumbs:[['Clientes'],['Comercial']],search:'Buscar lead, empresa ou contato...',
  actions:`<button class="btn btn-ghost" id="leadReports"><i data-lucide="chart-no-axes-column"></i>Relatórios</button><button class="btn btn-ghost" id="leadReferences"><i data-lucide="tag"></i>Códigos</button><button class="btn btn-primary" id="newLead"><i data-lucide="plus"></i>Novo lead</button>`});

const STAGES=[['novo','Novo lead','var(--blue)'],['contato','Em contato','var(--orange)'],['reuniao','Reunião','var(--purple)'],['proposta','Proposta enviada','var(--yellow)'],['aguardando_contrato','Aguardando contrato','var(--pink)'],['fechado','Fechado','var(--green)'],['venda_perdida','Venda perdida','var(--muted)']];
const SOURCES=['Meta Ads','Google Ads','Prospecção','WhatsApp','Site','Indicação','Instagram','Evento'];
const SRC={'Meta Ads':'pink','Google Ads':'yellow','Prospecção':'blue','WhatsApp':'green','Site':'orange','Indicação':'purple','Instagram':'pink','Evento':'gray'};
const CONTRACT={dados:['Aguardando dados','orange'],elab:['Em elaboração','blue'],aguard:['Aguardando assinatura','yellow'],assin:['Assinado','green'],canc:['Cancelado / Não concluído','gray']};
const CATEGORY_LABEL={gestao:'Gestão',projeto:'Projeto',outro:'Outro'};
const WAIT=['Sem resposta (com data de retorno)','Retomada futura (ex.: 3 meses)','Aguardando definição do cliente'];
const ARCH=['Não teve interesse','Desqualificado (fora do perfil)','Não respondeu (após tentativas)','Fechou com outra empresa'];
const CHANNELS=[['manual','Cadastro manual'],['form','Formulário do site'],['whatsapp','WhatsApp manual'],['meta_form','Formulário Meta'],['whatsapp_api','WhatsApp integrado'],['integration','Outra integração']];
const EMPTY_FILTERS={src:'',owner:'',from:'',to:'',product:'',stage:''};
// filters = o que está aplicado; draft = o que a pessoa está montando (só vale ao clicar em "Aplicar filtros").
let leads=[],owners=[],tab='andamento',filters={...EMPTY_FILTERS},draft={...EMPTY_FILTERS},q='';
let canViewValues=true,dashboardData=null,dashboardPrev=null,dashboardRange=null,dashboardIds=null,dashboardMetric='',catalog={gestao:[],projeto:[],outro:[]};
const ownerName=id=>owners.find(o=>o.id===id)?.name||'';
const wa=p=>'https://wa.me/55'+String(p||'').replace(/\D/g,'');
const dateInput=ms=>{if(!ms)return '';const date=new Date(ms);return new Date(ms-date.getTimezoneOffset()*60000).toISOString().slice(0,16);};
const stageLabel=stage=>STAGES.find(s=>s[0]===stage)?.[1]||(stage==='negociacao'?'Negociação':stage);
const brlCents=cents=>PF.brl((Number(cents)||0)/100);
const productTotal=products=>(products||[]).reduce((sum,item)=>sum+Number(item.amount_cents||0),0);
const contractLabel=status=>CONTRACT[status]?.[0]||status;
const contractAge=c=>Math.floor((Date.now()-Number(c.status==='aguard'?c.sent_at||c.created_at:c.created_at||0))/86400000);
const pendingContract=c=>['dados','aguard'].includes(c.status)&&contractAge(c)>=3;

async function load(){
  try{const d=await PF.api('/api/leads');leads=d.leads;owners=d.owners;canViewValues=d.canViewValues!==false;if(d.catalog)catalog=d.catalog;}catch(e){PF.toast(e.message,'err');}
  await loadDashboard();
  render();
}
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayOf=s=>new Date(s+'T12:00:00');
function dateRange(){return {from:filters.from,to:filters.to};}
// Período do resumo e período de comparação.
// Com datas: o período escolhido × o mesmo número de dias logo antes. Sem datas: este mês (até hoje) × o mesmo trecho do mês anterior.
function summaryRanges(){
  const today=new Date();
  if(filters.from||filters.to){
    const from=filters.from||'',to=filters.to||isoDay(today);
    if(!from)return {cur:{from,to},prev:null,label:'até '+to.split('-').reverse().join('/'),cmp:''};
    const days=Math.round((dayOf(to)-dayOf(from))/86400000)+1,pEnd=new Date(dayOf(from));pEnd.setDate(pEnd.getDate()-1);
    const pStart=new Date(pEnd);pStart.setDate(pStart.getDate()-days+1);
    return {cur:{from,to},prev:{from:isoDay(pStart),to:isoDay(pEnd)},cmp:'vs. período anterior'};
  }
  const first=new Date(today.getFullYear(),today.getMonth(),1),pFirst=new Date(today.getFullYear(),today.getMonth()-1,1);
  const pLast=new Date(today.getFullYear(),today.getMonth(),0),pTo=new Date(pFirst);pTo.setDate(Math.min(today.getDate(),pLast.getDate()));
  return {cur:{from:isoDay(first),to:isoDay(today)},prev:{from:isoDay(pFirst),to:isoDay(pTo)},cmp:'este mês vs. mês anterior'};
}
function dashboardParams(range=dateRange()){
  const p=new URLSearchParams();
  p.set('tz',String(new Date().getTimezoneOffset()));
  for(const [key,value] of Object.entries({from:range.from,to:range.to,source:filters.src,owner:filters.owner,
    product:filters.product,stage:filters.stage,q}))if(value)p.set(key,value);
  return p;
}
async function loadDashboard(){
  dashboardRange=summaryRanges();
  try{
    const [cur,prev]=await Promise.all([PF.api('/api/leads/reports?'+dashboardParams(dashboardRange.cur).toString()),
      dashboardRange.prev?PF.api('/api/leads/reports?'+dashboardParams(dashboardRange.prev).toString()):null]);
    dashboardData=cur.dashboard;dashboardPrev=prev?.dashboard||null;
  }catch(e){dashboardData=null;dashboardPrev=null;PF.toast(e.message,'err');}
}
async function refreshFilters(){draft={...filters};dashboardIds=null;dashboardMetric='';await loadDashboard();render();}
const draftChanged=()=>Object.keys(EMPTY_FILTERS).some(k=>draft[k]!==filters[k]);
const activeCount=()=>Object.values(filters).filter(Boolean).length;
async function patch(body,msg){
  try{await PF.api('/api/leads',{method:'PATCH',body});if(msg)PF.toast(msg,'ok');}catch(e){PF.toast(e.message,'err');}
  await load();
}

function productsLabel(l){
  const products=l.products||[];
  if(!products.length)return '';
  const names=products.slice(0,2).map(p=>`${p.name}${canViewValues?` (${brlCents(p.amount_cents)})`:''}`);
  if(products.length>2)names.push(`+${products.length-2}`);
  return names.join(' · ');
}
// O contrato é gerado depois da reunião com o cliente: o botão só aparece na etapa Reunião.
// Em Proposta enviada e Aguardando contrato aparece só a situação do contrato.
function canGenerate(l){
  if(l.stage!=='reuniao')return false;
  const kinds=new Set((l.contracts||[]).filter(c=>c.status!=='canc').map(c=>c.kind));
  return !kinds.has('Gestão')||!kinds.has('Projetos');
}
function contractsSummary(l){
  const contracts=l.contracts||[];
  if(!contracts.length)return '';
  const shortStatus={dados:'Aguard. dados',elab:'Em elaboração',aguard:'Aguard. assinatura',assin:'Assinado',canc:'Não concluído'};
  const labels=contracts.slice(0,2).map(c=>`${c.kind==='Gestão'?'Gestão':'Projeto'}: ${shortStatus[c.status]||c.status}`);
  if(contracts.length>2)labels.push(`+${contracts.length-2}`);
  return labels.join(' · ');
}
// Lista completa por trás de um número do resumo (ou de um produto). Clicar na empresa abre a oportunidade.
let expandedProduct='';
const fdate=ms=>ms?new Date(Number(ms)).toLocaleDateString('pt-BR'):'—';
const METRIC_DATE={leadsReceived:['Recebido em',l=>l.conversion_at||l.created_at],proposals:['Proposta enviada em',l=>l.proposal_sent_at],
  closed:['Fechado em',l=>l.signed_at],lost:['Perdido em',l=>l.lost_at],product:['Entrada',l=>l.conversion_at||l.created_at]};
function leadsTable(ids,metric,productName=''){
  const rows=ids.map(id=>leads.find(l=>l.id===id)).filter(Boolean);
  if(!rows.length)return '<p class="muted small" style="margin:6px 0">Nenhuma oportunidade.</p>';
  const [dLabel,dOf]=METRIC_DATE[metric]||METRIC_DATE.product;
  const value=l=>{const p=productName?(l.products||[]).filter(x=>x.name===productName):(l.products||[]);return brlCents(productTotal(p));};
  return `<div class="table-wrap"><table class="report-table"><thead><tr><th>Empresa</th><th>Contato</th><th>Origem</th><th>Produto / serviço</th>${canViewValues?'<th class="right">Valor</th>':''}<th>Etapa</th><th>${dLabel}</th><th>Responsável</th></tr></thead><tbody>
    ${rows.map(l=>`<tr><td><a class="link" href="#" data-open="${l.id}"><b>${PF.esc(l.company)}</b></a><div class="muted tiny">${PF.esc(l.segment||'')}</div></td>
      <td>${PF.esc(l.contact_name||'—')}${l.phone?`<div class="muted tiny">${PF.esc(l.phone)}</div>`:''}</td><td>${PF.esc(l.source||'—')}</td>
      <td>${PF.esc((l.products||[]).map(p=>p.name).join(', ')||'—')}</td>${canViewValues?`<td class="right nowrap">${value(l)}</td>`:''}
      <td>${PF.esc(stageLabel(l.stage))}${metric==='lost'&&l.loss_reason?`<div class="muted tiny">${PF.esc(l.loss_reason)}</div>`:''}${l.situation!=='andamento'?`<div class="muted tiny">${l.situation==='espera'?'em espera':'arquivado'}</div>`:''}</td>
      <td class="nowrap">${fdate(dOf(l))}</td><td>${PF.esc(ownerName(l.owner_id)||'—')}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function dashboardHTML(visible){
  const data=dashboardData;
  if(!data)return '';
  // Resumo no mesmo formato do painel geral: ícone, número, variação e comparação.
  // "lower" = quanto menor, melhor (vendas perdidas: subir é ruim).
  const metrics=[
    ['leadsReceived','Leads recebidos','user-plus','blue',null],
    ['proposals','Propostas enviadas','send','orange','proposalValueCents'],
    ['closed','Vendas fechadas','circle-check','green','closedValueCents'],
    ['lost','Vendas perdidas','circle-x','pink',null,true],
  ];
  const R=dashboardRange||{cmp:''};
  const cards=metrics.map(([key,label,icon,color,valueKey,lower])=>{
    const n=data[key]?.count||0,p=dashboardPrev?.[key]?.count;
    let delta='',kind='flat';
    if(dashboardPrev){
      if(p===0)delta=n?'novo':'0%';
      else{const pct=Math.round((n-p)/p*100);delta=(pct>0?'↑ ':pct<0?'↓ ':'')+Math.abs(pct)+'%';kind=pct===0?'flat':(pct>0)!==!!lower?'up':'down';}
      if(p===0&&n)kind=lower?'down':'up';
    }
    const money=canViewValues&&valueKey&&data[valueKey]?brlCents(data[valueKey])+' · ':'';
    return PF.kpi({icon,color,value:String(n),delta,deltaKind:kind,label,sub:money+(R.cmp||R.label||''),click:key,active:dashboardMetric===key});
  }).join('');
  const alerts=visible.flatMap(lead=>(lead.contracts||[]).filter(pendingContract).map(contract=>({lead,contract,days:contractAge(contract)})));
  return `<section class="crm-dashboard">
    <div class="grid g4">${cards}</div>
    ${dashboardMetric?`<div><button class="btn btn-ghost btn-sm" data-clear-kpi><i data-lucide="x"></i>Limpar seleção do indicador (o funil está filtrado)</button></div>`:''}
    ${alerts.length?`<div class="note crm-alert"><i data-lucide="bell-ring"></i><div><b>Contratos pendentes há 3 dias ou mais</b>
      <div class="small">${alerts.map(({lead,contract,days})=>`<a class="link" href="#" data-open="${lead.id}">${PF.esc(lead.company)}</a> · ${PF.esc(contractLabel(contract.status))} há ${days} dias`).join(' · ')}</div></div></div>`:''}
    <div><section class="card crm-products"><b>Oportunidades por produto / serviço</b>
      <table class="report-table"><thead><tr><th>Produto / serviço</th><th>Oportunidades</th>${canViewValues?'<th>Valor envolvido</th>':''}</tr></thead><tbody>
      ${data.byProduct.length?data.byProduct.map(item=>{const open=expandedProduct===item.name;
        return `<tr data-product-toggle="${PF.esc(item.name)}" style="cursor:pointer" title="Clique para ver as oportunidades"><td><i data-lucide="${open?'chevron-down':'chevron-right'}" style="width:14px;vertical-align:-2px"></i> ${PF.esc(item.name)}</td><td>${item.opportunities}</td>${canViewValues?`<td>${brlCents(item.amount_cents)}</td>`:''}</tr>
        ${open?`<tr class="crm-sub"><td colspan="${canViewValues?3:2}">${leadsTable(item.ids||[],'product',item.name)}
          <a class="link small" href="#" data-product-filter="${PF.esc(item.name)}">Filtrar o funil por este produto</a></td></tr>`:''}`;}).join(''):`<tr><td colspan="${canViewValues?3:2}">Sem produtos neste filtro.</td></tr>`}
      </tbody></table></section></div>
  </section>`;
}
// Período no topo do painel; os demais filtros ficam abaixo do painel, junto do funil.
// Nos dois blocos nada muda até clicar em "Aplicar".
const PERIOD_KEYS=['from','to'],OTHER_KEYS=['src','owner','product','stage'];
const changedIn=keys=>keys.some(k=>draft[k]!==filters[k]);
const pendingTag=(id,keys)=>`<span class="small" id="${id}" style="color:var(--yellow)" ${changedIn(keys)?'':'hidden'}>Alterações ainda não aplicadas</span>`;
// Período e filtros lado a lado, numa faixa compacta no topo (mesma altura). Cada um com seu "Aplicar".
function periodHTML(){
  const n=PERIOD_KEYS.filter(k=>filters[k]).length;
  return `<section class="card crm-bar">
    <div class="crm-bar-head"><b>Período</b>${n?'<span class="count">aplicado</span>':'<span class="muted tiny">sem datas = mês atual</span>'}
      <span class="crm-bar-acts">${pendingTag('pPending',PERIOD_KEYS)}<a class="link small" href="#" id="pClear">Limpar</a>
        <button class="btn btn-primary btn-sm" id="pApply" ${changedIn(PERIOD_KEYS)?'':'disabled'}><i data-lucide="calendar-check"></i>Aplicar</button></span></div>
    <div class="crm-bar-fields">
      <input class="input" type="date" id="fFrom" value="${draft.from}" aria-label="De" title="De">
      <span class="muted small">até</span>
      <input class="input" type="date" id="fTo" value="${draft.to}" aria-label="Até" title="Até">
    </div>
  </section>`;
}
function filtersHTML(productOptions){
  const n=OTHER_KEYS.filter(k=>filters[k]).length;
  return `<section class="card crm-bar">
    <div class="crm-bar-head"><b>Filtros</b>${n?`<span class="count">${n} aplicado(s)</span>`:''}
      <span class="crm-bar-acts">${pendingTag('fPending',OTHER_KEYS)}<a class="link small" href="#" id="fClear">Limpar</a>
        <button class="btn btn-primary btn-sm" id="fApply" ${changedIn(OTHER_KEYS)?'':'disabled'}><i data-lucide="filter"></i>Aplicar</button></span></div>
    <div class="crm-bar-fields">
      ${PF.select('fSrc','Origem',[['','Origem: Todas'],...[...new Set(leads.map(l=>l.source).filter(Boolean))].map(s=>[s,s])])}
      ${PF.select('fOwner','Responsável',[['','Responsável: Todos'],...owners.map(o=>[o.id,o.name])])}
      ${PF.select('fProduct','Produto / serviço',[['','Produto: todos'],...productOptions.map(name=>[name,name])])}
      ${PF.select('fStage','Etapa',[['','Etapa: todas'],...STAGES.map(([key,label])=>[key,label])])}
    </div>
  </section>`;
}

function card(l){
  const total=productTotal(l.products),summary=productsLabel(l),contractSummary=contractsSummary(l);
  const alerts=(l.contracts||[]).filter(pendingContract);
  return `<div class="kcard" ${l.stage==='fechado'?'data-locked="true" ':''}data-id="${l.id}">
    <div class="top"><div><b>${PF.esc(l.company)}</b><small>${PF.esc(l.segment||'—')}</small></div><button class="icon-btn" data-open="${l.id}" aria-label="Abrir"><i data-lucide="ellipsis-vertical"></i></button></div>
    ${l.source?`<span class="badge b-${SRC[l.source]||'gray'} src">${PF.esc(l.source)}</span>`:''}
    ${l.contact_name?`<div class="contact"><i data-lucide="user"></i>${PF.esc(l.contact_name)}</div>`:''}

function render(){
  const by=s=>leads.filter(l=>l.situation===s);
  const range=dateRange(),fromAt=range.from?new Date(range.from+'T00:00').getTime():null,toAt=range.to?new Date(range.to+'T23:59:59.999').getTime():null;
  const eventDate=l=>Number(l.stage==='proposta'?l.proposal_sent_at:l.stage==='aguardando_contrato'?l.accepted_at:l.stage==='fechado'?l.signed_at:l.stage==='venda_perdida'?l.lost_at:l.created_at)||Number(l.created_at);
  const match=l=>dashboardIds?dashboardIds.has(l.id):
    (!filters.src||l.source===filters.src)&&(!filters.owner||l.owner_id===filters.owner)&&
    (!filters.product||(l.products||[]).some(p=>p.name===filters.product))&&(!filters.stage||l.stage===filters.stage)&&
    (!q||(l.company+' '+l.contact_name+' '+l.email+' '+l.phone).toLowerCase().includes(q))&&
    (fromAt===null||eventDate(l)>=fromAt)&&(toAt===null||eventDate(l)<=toAt);
  const active=by('andamento').filter(match),productOptions=[...new Set([...Object.values(catalog).flat(),...leads.flatMap(l=>(l.products||[]).map(p=>p.name)).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  content.innerHTML=`
  <div class="crm-top">${periodHTML()}${filtersHTML(productOptions)}</div>
  <p class="muted tiny" style="margin:-6px 0 12px">Datas consideradas: leads recebidos pela entrada · propostas pelo envio/renegociação · fechamentos pela assinatura de todos os contratos obrigatórios · perdas pela data da perda.</p>
  ${dashboardHTML(active)}
  <div class="tabs">${[['andamento','Em andamento'],['espera','Em espera'],['arquivado','Arquivados']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}<span class="count">${by(k).filter(match).length}</span></button>`).join('')}</div>
  ${tab==='andamento'?`
  <div class="kanban mb">${STAGES.map(([k,label,c])=>{const items=active.filter(l=>l.stage===k);return `<div class="col" data-col="${k}"><div class="col-head" style="--c:${c}">${label}<span class="n">${items.length}</span></div>${items.map(card).join('')||`<div class="empty-col">${k==='novo'&&!leads.length?'Clique em "Novo lead" para começar':'Arraste um lead para cá'}</div>`}</div>`;}).join('')}</div>`
  :`<div class="card mb">${by(tab).filter(match).length?`<table class="tbl"><thead><tr><th>Lead</th><th>Motivo</th>${tab==='espera'?'<th>Retomar em</th>':''}<th>Responsável</th><th></th></tr></thead><tbody>
    ${by(tab).filter(match).map(l=>`<tr><td><div class="who">${PF.chip(l.company)}<div><b>${PF.esc(l.company)}</b><small>${PF.esc(l.segment||'—')}</small></div></div></td><td>${PF.esc(l.reason)}</td>${tab==='espera'?`<td>${l.return_at?l.return_at.split('-').reverse().join('/'):'—'}</td>`:''}<td>${PF.esc(ownerName(l.owner_id)||'—')}</td>
      <td class="right"><button class="btn btn-ghost btn-sm" data-react="${l.id}"><i data-lucide="rotate-ccw"></i>Reativar oportunidade</button></td></tr>`).join('')}
    </tbody></table>`:`<div class="empty"><i data-lucide="inbox"></i><div>Nenhum lead ${tab==='espera'?'em espera':'arquivado'}.</div></div>`}</div>`}
  <section class="grid g3 info-cards">
    <div class="card t-wait"><div class="row"><div class="ico md c-yellow round"><i data-lucide="clock"></i></div><div><b>Em espera</b><p class="muted small">Leads que podem voltar a negociar, com data de retomada e responsável.</p></div></div>
      <ul>${WAIT.map(t=>`<li><i data-lucide="clock" style="color:var(--yellow)"></i>${t}</li>`).join('')}</ul></div>
    <div class="card t-arch"><div class="row"><div class="ico md c-pink round"><i data-lucide="mail-x"></i></div><div><b>Arquivados</b><p class="muted small">Leads encerrados, com o motivo registrado e histórico salvo.</p></div></div>
      <ul>${ARCH.map(t=>`<li><i data-lucide="square-x" style="color:var(--pink)"></i>${t}</li>`).join('')}</ul></div>
    <div class="card t-hist"><div class="row"><div class="ico md c-green round"><i data-lucide="file-text"></i></div><div><b>Da oportunidade ao cliente</b><p class="muted small">Quando o cliente aceitar, clique em <b>Gerar contrato</b>. A oportunidade vai para <b>Aguardando contrato</b>; só a confirmação da assinatura fecha a oportunidade e cria o cliente.</p></div></div>
      <a class="btn btn-ghost" style="margin-top:auto" href="contratos.html"><i data-lucide="file-signature"></i>Ver contratos</a></div>
  </section>`;
  PF.icons();
  content.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  content.querySelectorAll('[data-kpi]').forEach(button=>button.onclick=()=>{
    const key=button.dataset.kpi;dashboardMetric=dashboardMetric===key?'':key;
    const metricIds=dashboardMetric==='conversionRate'?dashboardData?.conversionRateIds:dashboardData?.[dashboardMetric]?.ids;
    dashboardIds=dashboardMetric?new Set(metricIds||[]):null;render();
  });
  const clearKpi=content.querySelector('[data-clear-kpi]');
  if(clearKpi)clearKpi.onclick=()=>{dashboardIds=null;dashboardMetric='';render();};
  content.querySelectorAll('[data-product-toggle]').forEach(row=>row.onclick=()=>{const n=row.dataset.productToggle;expandedProduct=expandedProduct===n?'':n;render();});
  content.querySelectorAll('[data-product-filter]').forEach(a=>a.onclick=e=>{e.preventDefault();filters.product=a.dataset.productFilter;expandedProduct='';refreshFilters();});
  content.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.preventDefault();openLead(leads.find(l=>l.id===b.dataset.open));});
  // Montar período/filtros não recarrega nada: só os botões "Aplicar" atualizam o painel e o funil.
  const note=()=>{for(const [btn,tag,keys] of [['#pApply','#pPending',PERIOD_KEYS],['#fApply','#fPending',OTHER_KEYS]]){const c=changedIn(keys);content.querySelector(btn).disabled=!c;content.querySelector(tag).hidden=!c;}};
  for(const [id,key] of [['fSrc','src'],['fOwner','owner'],['fProduct','product'],['fStage','stage'],['fFrom','from'],['fTo','to']]){
    const el=content.querySelector('#'+id);el.value=draft[key];
    const upd=()=>{draft[key]=el.value;note();};el.onchange=upd;if(el.type==='date')el.oninput=upd;
  }
  // Cada "Aplicar" aplica só o seu bloco; o que foi mexido no outro bloco continua pendente.
  const apply=keys=>{const pend=Object.fromEntries(Object.keys(EMPTY_FILTERS).filter(k=>!keys.includes(k)).map(k=>[k,draft[k]]));
    for(const k of keys)filters[k]=draft[k];refreshFilters().then(()=>{Object.assign(draft,pend);render();});};
  content.querySelector('#pApply').onclick=()=>{if(draft.from&&draft.to&&draft.to<draft.from)return PF.toast('A data final não pode ser antes da inicial.','err');apply(PERIOD_KEYS);};
  content.querySelector('#fApply').onclick=()=>apply(OTHER_KEYS);
  const clear=keys=>{for(const k of keys){filters[k]='';draft[k]='';}apply(keys);};
  content.querySelector('#pClear').onclick=e=>{e.preventDefault();clear(PERIOD_KEYS);};
  content.querySelector('#fClear').onclick=e=>{e.preventDefault();clear(OTHER_KEYS);};
  if(tab==='andamento'){
    PF.kanban(content.querySelector('.kanban'),(id,col)=>{
      const l=leads.find(x=>x.id===id);if(!l||l.stage===col)return;
      if(col==='fechado'){PF.toast('Fechado só é permitido após confirmar a assinatura do contrato.','err');return load();}
      if(col==='aguardando_contrato'){PF.toast('Use Gerar contrato para mover a oportunidade para esta etapa.','err');return load();}
      if(col==='venda_perdida'){markLost(l);return load();}
      if(col==='proposta'){PF.toast('Abra a oportunidade para registrar produtos e valores da proposta.','err');openLead(l);return load();}
      if(l.stage==='fechado'){PF.toast('Uma oportunidade fechada não pode ser movida manualmente.','err');return load();}
      patch({id,stage:col},`${l.company} → ${stageLabel(col)}`);
    });
    content.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>generate(leads.find(l=>l.id===b.dataset.gen)));
  }
  content.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>patch({id:b.dataset.react,situation:'andamento'},'Lead voltou para o funil.'));
}

const formData=f=>{
  const d=Object.fromEntries(new FormData(f));
  if(d.conversion_at)d.conversion_at=new Date(d.conversion_at).toISOString();
  return d;
};

async function resolveReference(form){
  const input=form.elements.namedItem('reference_code'),status=form.querySelector('[data-reference-status]');
  const code=String(input?.value||'').trim();
  if(!code){if(status)status.textContent='';return true;}
  if(String(input.dataset.initial||'')===code){if(status)status.textContent='';return true;}
  try{
    const {reference:r}=await PF.api('/api/lead-references?code='+encodeURIComponent(code));
    if(String(input.dataset.initial||'')!==code){
      for(const [key,value] of Object.entries({source:'WhatsApp',lead_source:'whatsapp',attribution_method:'manual',
        platform:r.platform,campaign_name:r.campaign_name,ad_name:r.ad_name,utm_source:r.utm_source,utm_medium:r.utm_medium,
        utm_campaign:r.utm_campaign,utm_content:r.utm_content,utm_term:r.utm_term,gclid:r.gclid,fbclid:r.fbclid})){
        const field=form.elements.namedItem(key);if(field)field.value=value||'';
      }
    }
    if(status){status.textContent=`Código válido: ${r.campaign_name}${r.ad_name?' · '+r.ad_name:''}`;status.className='small note info';}
    return true;
  }catch(e){if(status){status.textContent=e.message;status.className='small note err';}return false;}
}
function bindReference(form){
  const input=form.elements.namedItem('reference_code');
  if(!input)return;
  input.dataset.initial=String(input.value||'');
  input.addEventListener('blur',()=>resolveReference(form));
}

function markLost(l){
  const m=PF.modal(`<div class="modal-head"><div><h3>Registrar venda perdida</h3><p class="muted small">${PF.esc(l.company)} · o motivo ficará no histórico da oportunidade.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="lossForm"><label class="field"><span>Motivo da perda</span><textarea class="input" name="loss_reason" maxlength="1000" required style="min-height:100px">${PF.esc(l.loss_reason||'')}</textarea></label>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Confirmar venda perdida</button></div></form>`);
  m.el.querySelector('#lossForm').onsubmit=async e=>{
    e.preventDefault();const loss_reason=String(new FormData(e.target).get('loss_reason')||'').trim();
    if(!loss_reason)return PF.toast('Informe o motivo da perda.','err');
    m.close();await patch({id:l.id,stage:'venda_perdida',loss_reason},'Venda perdida registrada.');
  };
}

// Produto/serviço vem do catálogo da categoria (planos de Gestão e tipos de Projeto). "Outro" é texto livre.
function productNameField(category,name=''){
  const list=catalog[category]||[];
  if(!list.length)return `<input class="input" data-product-name maxlength="120" value="${PF.esc(name)}" placeholder="Descreva o produto ou serviço">`;
  const extra=name&&!list.includes(name)?`<option value="${PF.esc(name)}" selected>${PF.esc(name)} (fora da lista)</option>`:'';
  return `<select class="select-in" data-product-name><option value="">Escolha…</option>${extra}${list.map(n=>`<option value="${PF.esc(n)}" ${n===name?'selected':''}>${PF.esc(n)}</option>`).join('')}</select>`;
}
function productRow(product={}){

    <label class="field"><span>Categoria</span><select class="select-in" data-product-category>${Object.entries(CATEGORY_LABEL).map(([key,label])=>`<option value="${key}" ${key===category?'selected':''}>${label}</option>`).join('')}</select></label>

function readProducts(form){

function contractDetails(l){

function openLead(l){
  const c=CONTRACT[l.contract_status];
  const m=PF.modal(`<div class="modal-head"><div><h3>${PF.esc(l.company)}</h3><p class="muted small">Data da conversão: ${new Date(l.conversion_at||l.created_at).toLocaleDateString('pt-BR')}</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="f">
      ${fields(l)}
      <label class="field"><span>Etapa do funil</span><select class="select-in" name="stage" ${l.stage==='fechado'?'disabled':''}>${STAGES.map(([k,lb])=>`<option value="${k}" ${k===l.stage?'selected':''} ${k==='fechado'&&l.stage!=='fechado'?'disabled':''} ${k==='aguardando_contrato'&&l.stage!=='aguardando_contrato'?'disabled':''}>${lb}</option>`).join('')}</select></label>
      ${productsEditor(l)}
      <label class="field" id="lossReasonField" ${l.stage==='venda_perdida'?'':'hidden'}><span>Motivo da venda perdida</span><textarea class="input" name="loss_reason" maxlength="1000" ${l.stage==='venda_perdida'?'required':'disabled'} style="min-height:80px">${PF.esc(l.loss_reason||'')}</textarea></label>
      <label class="field"><span>Anotações (triagem, interações, combinados)</span><textarea class="input" name="notes" style="min-height:90px">${PF.esc(l.notes||'')}</textarea></label>
      <section class="card flat"><b>Andamento dos contratos</b>${contractDetails(l)}</section>
      <div class="card flat" id="leadHistory"><span class="muted small">Carregando histórico...</span></div>
      ${c?`<a class="note info" href="contratos.html"><i data-lucide="file-text"></i><div>${c[0]}. <b>Ver em Contratos →</b></div></a>`:''}
      <div class="row wrap" style="gap:8px">
        ${canGenerate(l)?`<button type="button" class="btn btn-primary btn-sm" id="gen"><i data-lucide="file-plus"></i>Gerar contrato</button>`:''}
        <button type="button" class="btn btn-ghost btn-sm" id="wait"><i data-lucide="clock"></i>Colocar em espera</button>
        <button type="button" class="btn btn-ghost btn-sm" id="arch"><i data-lucide="archive"></i>Arquivar</button>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Salvar</button></div>
    </form>`,{wide:true});
  const f=m.el.querySelector('#f');
  bindReference(f);
  f.onsubmit=async e=>{
    e.preventDefault();if(!await resolveReference(f))return;
    const data=formData(f);
    if(data.stage==='venda_perdida'&&!String(data.loss_reason||'').trim())return PF.toast('Informe o motivo da perda.','err');
    if(canViewValues){
      data.products=readProducts(f);
      if(data.stage==='proposta'&&!data.products.length)return PF.toast('Inclua ao menos um produto na proposta.','err');
    }
    m.close();await patch({id:l.id,...data},'Lead atualizado.');
  };
  const stageSelect=f.elements.namedItem('stage'),lossField=f.querySelector('#lossReasonField'),lossInput=f.elements.namedItem('loss_reason');
  const productBox=f.querySelector('#productsEditor');
  const refreshProductTotal=()=>{const total=f.querySelector('#productTotal');if(total)total.textContent=brlCents(readProducts(f).reduce((sum,p)=>sum+p.amount_cents,0));};
  const setProductRequired=required=>productBox.querySelectorAll('[data-product-name]').forEach(input=>input.required=required);
  if(stageSelect)stageSelect.onchange=()=>{
    const lost=stageSelect.value==='venda_perdida';lossField.hidden=!lost;lossInput.required=lost;lossInput.disabled=!lost;
    setProductRequired(stageSelect.value==='proposta');
  };
  setProductRequired(l.stage==='proposta');
  f.querySelector('#addProduct').onclick=()=>{productBox.querySelector('#productRows').insertAdjacentHTML('beforeend',productRow());PF.icons();setProductRequired(stageSelect.value==='proposta');};
  productBox.onclick=e=>{const remove=e.target.closest('[data-remove-product]');if(remove){remove.closest('[data-product-row]').remove();refreshProductTotal();}};
  productBox.oninput=refreshProductTotal;
  // Trocar a categoria troca a lista de produtos daquela categoria.
  productBox.onchange=e=>{const cat=e.target.closest('[data-product-category]');if(!cat)return;
    const wrap=cat.closest('[data-product-row]').querySelector('[data-name-wrap]');
    wrap.innerHTML='<span>Produto / serviço</span>'+productNameField(cat.value);setProductRequired(stageSelect.value==='proposta');};
  showLeadHistory(l.id,m.el.querySelector('#leadHistory'));
  const g=m.el.querySelector('#gen');if(g)g.onclick=()=>{m.close();generate(l);};
  m.el.querySelector('#wait').onclick=()=>reason(l,'espera');
  m.el.querySelector('#arch').onclick=()=>reason(l,'arquivado');
  function reason(l,kind){
    const opts=kind==='espera'?WAIT:ARCH;
    const r=PF.modal(`<div class="modal-head"><h3>${kind==='espera'?'Colocar em espera':'Arquivar lead'}</h3><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
      <form class="stack" id="r"><label class="field"><span>Motivo</span><select class="select-in" name="reason">${opts.map(o=>`<option>${o}</option>`).join('')}</select></label>
      ${kind==='espera'?'<label class="field"><span>Retomar em</span><input class="input" type="date" name="return_at"></label>':''}
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Confirmar</button></div></form>`);
    r.el.querySelector('#r').onsubmit=async e=>{e.preventDefault();const d=formData(e.target);r.close();m.close();await patch({id:l.id,situation:kind,...d},kind==='espera'?'Lead em espera.':'Lead arquivado.');};
  }

  async function showLeadHistory(id,box){
    try{
      const data=await PF.api('/api/leads/history?lead_id='+encodeURIComponent(id));
      const attr=data.history.map(item=>{
        let values={};try{values=JSON.parse(item.new_data);}catch{}
        return `<li><b>${PF.esc(item.changed_by_name||'Sistema')}</b> · ${PF.fmtDate(item.created_at,{day:'2-digit',month:'2-digit',year:'numeric'})} ${PF.fmtTime(item.created_at)}<div class="muted small">${PF.esc(Object.entries(values).map(([k,v])=>`${k}: ${v||'—'}`).join(' · '))}</div></li>`;
      }).join('');
      const stage=data.stages.map(item=>`<li><b>${PF.esc(item.changed_by_name||'Sistema')}</b> · ${PF.fmtDate(item.changed_at,{day:'2-digit',month:'2-digit',year:'numeric'})} ${PF.fmtTime(item.changed_at)}<div class="muted small">${PF.esc(item.from_stage?`${stageLabel(item.from_stage)} → ${stageLabel(item.to_stage)}`:`Lead criado em ${stageLabel(item.to_stage)}`)}${item.reason?` · Motivo da venda perdida: ${PF.esc(item.reason)}`:''}</div></li>`).join('');
      const productChanges=data.products.map(item=>{
        let oldItems=[],newItems=[];try{oldItems=JSON.parse(item.old_data);}catch{}try{newItems=JSON.parse(item.new_data);}catch{}
        const label=items=>items.map(p=>`${p.name}${canViewValues?` (${brlCents(p.amount_cents)})`:''}`).join(' · ')||'Nenhum produto';
        return `<li><b>${PF.esc(item.changed_by_name||'Sistema')}</b> · ${PF.fmtDate(item.created_at,{day:'2-digit',month:'2-digit',year:'numeric'})} ${PF.fmtTime(item.created_at)}<div class="muted small">${PF.esc(label(oldItems))} → ${PF.esc(label(newItems))}</div></li>`;
      }).join('');
      const contractChanges=data.contracts.map(item=>{
        const contract=(l.contracts||[]).find(c=>c.id===item.contract_id);
        return `<li><b>${PF.esc(item.changed_by_name||'Sistema')}</b> · ${PF.fmtDate(item.created_at,{day:'2-digit',month:'2-digit',year:'numeric'})} ${PF.fmtTime(item.created_at)}<div class="muted small">${PF.esc(contract?.kind||'Contrato')} · ${PF.esc(item.action)} · ${PF.esc(contractLabel(item.to_status)||'Criado')}</div></li>`;
      }).join('');
      box.innerHTML=`<b>Histórico da oportunidade</b><div class="grid g2" style="margin-top:10px">
        <div><span class="muted small">Etapas</span><ul class="small" style="padding-left:18px">${stage||'<li>Sem alterações.</li>'}</ul></div>
        <div><span class="muted small">Produtos e valores</span><ul class="small" style="padding-left:18px">${productChanges||'<li>Sem alterações.</li>'}</ul></div>
        <div><span class="muted small">Contratos</span><ul class="small" style="padding-left:18px">${contractChanges||'<li>Sem alterações.</li>'}</ul></div>
        <div><span class="muted small">Origem</span><ul class="small" style="padding-left:18px">${attr||'<li>Sem alterações.</li>'}</ul></div></div>`;
    }catch(e){box.innerHTML=`<span class="small" style="color:var(--pink)">Não foi possível carregar o histórico: ${PF.esc(e.message)}</span>`;}
  }
}

function generate(l){
  const activeKinds=new Set((l.contracts||[]).filter(c=>c.status!=='canc').map(c=>c.kind));
  const options=Object.keys(PF.contractModels).map(kind=>{
    const names=(l.products||[]).filter(p=>p.category===(kind==='Gestão'?'gestao':'projeto')).map(p=>p.name.toLowerCase()).join(' ');
    const suggested=kind==='Projetos'&&/e-?commerce|loja/.test(names)?'E-commerce (Tray)'
      :kind==='Projetos'&&/site|website/.test(names)?'Website':PF.contractModels[kind][0];
    return `<label class="card flat row" style="align-items:center;gap:12px"><input type="checkbox" data-contract-kind="${kind}" ${activeKinds.has(kind)?'disabled':''}>
      <b style="min-width:145px">Contrato de ${kind==='Gestão'?'Gestão':'Projeto'}${activeKinds.has(kind)?' · já gerado':''}</b>
      <select class="select-in" data-contract-model="${kind}" ${activeKinds.has(kind)?'disabled':''}>${PF.contractModels[kind].map(model=>`<option ${model===suggested?'selected':''}>${PF.esc(model)}</option>`).join('')}</select></label>`;
  }).join('');
  const m=PF.modal(`<div class="modal-head"><div><h3>Gerar contratos</h3><p class="muted small">${PF.esc(l.company)} · selecione os tipos necessários.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="contractBatch"><div class="stack">${options}</div>
      <div class="attr-divider"><b>Como obter os dados do cliente?</b></div>
      <label class="row"><input type="radio" name="mode" value="internal" checked> Preencher os dados internamente</label>
      <label class="row"><input type="radio" name="mode" value="external"> Gerar link para o cliente preencher</label>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Continuar</button></div></form>`,{wide:true});
  m.el.querySelector('#contractBatch').onsubmit=async e=>{
    e.preventDefault();
    const selected=[...m.el.querySelectorAll('[data-contract-kind]:checked')].map(input=>({
      kind:input.dataset.contractKind,model:m.el.querySelector(`[data-contract-model="${input.dataset.contractKind}"]`).value,
    }));
    if(!selected.length)return PF.toast('Selecione ao menos um tipo de contrato.','err');
    const mode=new FormData(e.target).get('mode');m.close();
    if(mode==='internal'){
      let index=0;
      const next=()=>{
        if(index>=selected.length){load();return;}
        const {kind,model}=selected[index++];
        const category=kind==='Gestão'?'gestao':'projeto';
        const amountCents=productTotal((l.products||[]).filter(p=>p.category===category));
        PF.contractForm({lead:l,fixedKind:kind,fixedModel:model,amountCents,onDone:async()=>{await load();next();}});
      };
      next();return;
    }
    const links=[],errors=[];
    for(const {kind,model} of selected){
      try{links.push({kind,...await PF.api('/api/contracts',{method:'POST',body:{leadId:l.id,kind,model,dataRequest:true}})});}
      catch(error){errors.push(`${kind}: ${error.message}`);break;}
    }
    await load();
    const result=PF.modal(`<div class="modal-head"><div><h3>Links dos formulários</h3><p class="muted small">Envie cada link ao cliente. Os links expiram em 30 dias.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
      <div class="stack">${links.map(item=>`<label class="field"><span>Contrato de ${PF.esc(item.kind)}</span><div class="row"><input class="input" readonly value="${PF.esc(item.url)}"><button type="button" class="btn btn-ghost btn-sm" data-copy="${PF.esc(item.url)}">Copiar</button></div></label>`).join('')}
      ${errors.length?`<div class="note err">${PF.esc(errors.join(' · '))}</div>`:''}${links.length?'':'<p class="muted">Nenhum link foi gerado.</p>'}</div>`,{wide:true});
    result.el.querySelectorAll('[data-copy]').forEach(button=>button.onclick=async()=>{
      try{await navigator.clipboard.writeText(button.dataset.copy);PF.toast('Link copiado.','ok');}
      catch{window.prompt('Copie o link do formulário:',button.dataset.copy);}
    });
  };
}

    <label class="field"><span>Plataforma de origem</span><input class="input" name="platform" required value="${PF.esc(r.platform||'')}" placeholder="Meta Ads, Google Ads..."></label></div>
  <div class="grid g2"><label class="field"><span>Campanha vinculada</span><input class="input" name="campaign_name" required value="${PF.esc(r.campaign_name||'')}"></label>
    <label class="field"><span>Anúncio ou criativo</span><input class="input" name="ad_name" value="${PF.esc(r.ad_name||'')}"></label></div>
  <div class="grid g3"><label class="field"><span>ID da campanha</span><input class="input" name="campaign_id" value="${PF.esc(r.campaign_id||'')}"></label>
    <label class="field"><span>ID do anúncio</span><input class="input" name="ad_id" value="${PF.esc(r.ad_id||'')}"></label>
    <label class="field"><span>ID do formulário</span><input class="input" name="form_id" value="${PF.esc(r.form_id||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM source</span><input class="input" name="utm_source" value="${PF.esc(r.utm_source||'')}"></label>
    <label class="field"><span>UTM medium</span><input class="input" name="utm_medium" value="${PF.esc(r.utm_medium||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM campaign</span><input class="input" name="utm_campaign" value="${PF.esc(r.utm_campaign||'')}"></label>
    <label class="field"><span>UTM content</span><input class="input" name="utm_content" value="${PF.esc(r.utm_content||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM term</span><input class="input" name="utm_term" value="${PF.esc(r.utm_term||'')}"></label>
    <label class="field"><span>gclid</span><input class="input" name="gclid" value="${PF.esc(r.gclid||'')}"></label></div>
  <label class="field"><span>fbclid</span><input class="input" name="fbclid" value="${PF.esc(r.fbclid||'')}"></label>`;
}

async function editReference(reference=null){
  const m=PF.modal(`<div class="modal-head"><div><h3>${reference?'Editar código':'Novo código de origem'}</h3><p class="muted small">O código deve ser incluído na mensagem pré-preenchida do anúncio.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="referenceForm">${referenceFormFields(reference||{})}<div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Salvar código</button></div></form>`,{wide:true});
  m.el.querySelector('#referenceForm').onsubmit=async e=>{
    e.preventDefault();const body=Object.fromEntries(new FormData(e.target));
    try{
      await PF.api('/api/lead-references',{method:reference?'PATCH':'POST',body:reference?{...body,id:reference.id}:body});
      m.close();PF.toast('Código salvo.','ok');showReferences();
    }catch(error){PF.toast(error.message,'err');}
  };
}

async function showReferences(){
  const m=PF.modal(`<div class="modal-head"><div><h3>Códigos de origem</h3><p class="muted small">Vincule códigos de mensagens do WhatsApp às campanhas e anúncios.</p></div><div class="row"><button class="btn btn-primary btn-sm" id="addReference"><i data-lucide="plus"></i>Novo código</button><button class="icon-btn" data-close><i data-lucide="x"></i></button></div></div><div id="referenceList" class="card flat">Carregando...</div>`,{wide:true});
  const draw=async()=>{
    const box=m.el.querySelector('#referenceList');
    try{
      const {references}=await PF.api('/api/lead-references');
      box.innerHTML=references.length?`<table class="report-table"><thead><tr><th>Código</th><th>Plataforma</th><th>Campanha / anúncio</th><th>Criado em</th><th>Status</th><th></th></tr></thead><tbody>${references.map(r=>`<tr>
        <td><b>${PF.esc(r.code)}</b></td><td>${PF.esc(r.platform)}</td><td>${PF.esc(r.campaign_name)}${r.ad_name?' · '+PF.esc(r.ad_name):''}</td>
        <td>${PF.fmtDate(r.created_at,{day:'2-digit',month:'2-digit',year:'numeric'})}</td>
        <td>${r.active?'Ativo':'Inativo'}</td><td class="right"><button class="btn btn-ghost btn-sm" data-edit-reference="${r.id}">Editar</button>
        <button class="btn btn-ghost btn-sm" data-toggle-reference="${r.id}" data-active="${r.active}">${r.active?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum código cadastrado.</div>';
      box.querySelectorAll('[data-edit-reference]').forEach(button=>button.onclick=()=>editReference(references.find(r=>r.id===button.dataset.editReference)));
      box.querySelectorAll('[data-toggle-reference]').forEach(button=>button.onclick=async()=>{
        try{await PF.api('/api/lead-references',{method:'PATCH',body:{id:button.dataset.toggleReference,active:button.dataset.active!=='1'}});await draw();}
        catch(error){PF.toast(error.message,'err');}
      });
    }catch(error){box.textContent=error.message;}
  };
  m.el.querySelector('#addReference').onclick=()=>editReference();
  await draw();
}

async function showLeadReports(){
  const m=PF.modal(`<div class="modal-head"><div><h3>Relatórios de campanhas</h3><p class="muted small">Leads, canais, etapas atuais e clientes por origem.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <div class="grid g2"><label class="field"><span>De</span><input class="input" type="date" id="reportFrom"></label><label class="field"><span>Até</span><input class="input" type="date" id="reportTo"></label></div><div id="reportContent">Carregando...</div>`,{wide:true});
  const draw=async()=>{
    const params=new URLSearchParams(),from=m.el.querySelector('#reportFrom').value,to=m.el.querySelector('#reportTo').value;
    params.set('tz',String(new Date().getTimezoneOffset()));
    if(from)params.set('from',from);if(to)params.set('to',to);
    const box=m.el.querySelector('#reportContent');box.textContent='Carregando...';
    try{
      const data=await PF.api('/api/leads/reports?'+params.toString());
      const table=(title,rows)=>`<section class="card flat mb"><h3>${title}</h3><table class="report-table"><thead><tr><th>Origem</th><th>Leads</th><th>Clientes</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${PF.esc(r.label)}</td><td>${r.leads}</td><td>${r.customers}</td></tr>`).join(''):'<tr><td colspan="3">Sem dados no período.</td></tr>'}</tbody></table></section>`;
      box.innerHTML=`<p class="muted small mb">${data.total} lead(s) no período.</p><div class="grid g2">${table('Por plataforma',data.byPlatform)}${table('Por canal de entrada',data.byChannel)}${table('Por campanha',data.byCampaign)}${table('Por anúncio',data.byAd)}</div>
        <section class="card flat"><h3>Funil atual por campanha</h3><table class="report-table"><thead><tr><th>Campanha</th><th>Etapa</th><th>Leads</th><th>Clientes</th></tr></thead><tbody>${data.funnel.length?data.funnel.map(r=>`<tr><td>${PF.esc(r.platform+' · '+r.campaign_name)}</td><td>${PF.esc(stageLabel(r.stage))}</td><td>${r.leads}</td><td>${r.customers}</td></tr>`).join(''):'<tr><td colspan="4">Sem dados no período.</td></tr>'}</tbody></table></section>`;
    }catch(error){box.textContent=error.message;}
  };
  m.el.querySelector('#reportFrom').onchange=draw;m.el.querySelector('#reportTo').onchange=draw;draw();
}

document.getElementById('newLead').onclick=()=>{
  const m=PF.modal(`<div class="modal-head"><div><h3>Novo lead</h3><p class="muted small">Entra na coluna "Novo lead". Esses dados vão para o contrato e para o cadastro do cliente.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
  <form class="stack" id="nl">${fields({})}
  <fieldset class="card flat" id="nlProducts"><legend><b>O que o cliente procura</b></legend>
    <div class="crm-contract-list" id="productRows">${productRow({category:'gestao'})}</div>
    <div class="row wrap" style="justify-content:space-between;margin-top:8px"><button type="button" class="btn btn-ghost btn-sm" id="addProduct"><i data-lucide="plus"></i>Adicionar produto</button><span class="muted small">Os valores entram depois, na proposta.</span></div></fieldset>
  <label class="field"><span>Anotações da triagem</span><textarea class="input" name="notes" style="min-height:80px"></textarea></label>
  <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Adicionar ao funil</button></div></form>`,{wide:true});
  const form=m.el.querySelector('#nl');bindReference(form);
  // No cadastro não há valor: some o campo de valor das linhas.
  const box=form.querySelector('#nlProducts'),noValue=()=>box.querySelectorAll('[data-product-amount]').forEach(i=>i.closest('.field').remove());noValue();
  form.querySelector('#addProduct').onclick=()=>{box.querySelector('#productRows').insertAdjacentHTML('beforeend',productRow());noValue();PF.icons();};
  box.onclick=e=>{const r=e.target.closest('[data-remove-product]');if(r)r.closest('[data-product-row]').remove();};
  box.onchange=e=>{const cat=e.target.closest('[data-product-category]');if(!cat)return;cat.closest('[data-product-row]').querySelector('[data-name-wrap]').innerHTML='<span>Produto / serviço</span>'+productNameField(cat.value);};
  form.onsubmit=async e=>{e.preventDefault();if(!await resolveReference(form))return;
    const body={...formData(form),products:readProducts(form)};
    try{await PF.api('/api/leads',{method:'POST',body});m.close();PF.toast('Lead adicionado em Novo lead.','ok');load();}catch(x){PF.toast(x.message,'err');}};
};
document.getElementById('leadReferences').onclick=showReferences;
document.getElementById('leadReports').onclick=showLeadReports;
document.getElementById('globalSearch').oninput=e=>{q=e.target.value.toLowerCase();refreshFilters();};
render();load();
</script>
</body>
