<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<script src="js/contrato-form.js"></script>
<style>
  .col-head{border-radius:8px;border-bottom:0;padding:9px 10px;background:color-mix(in srgb,var(--c) 22%,transparent)}
  .kcard .src{align-self:flex-start}
  .kcard .contact{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:12.5px}
  .kcard .contact .lucide{width:14px;height:14px;color:var(--muted)}
  .kcard .acts{display:flex;align-items:center;gap:6px}
  .wa{display:inline-flex;align-items:center;gap:5px;background:rgba(37,211,102,.15);color:#3ee07f;border-radius:6px;padding:4px 8px;font-size:11.5px;font-weight:600}
  .wa .lucide{width:13px;height:13px}
  .kcard .acts .icon-btn{width:26px;height:26px}
  .kcard .acts .icon-btn .lucide{width:15px}
  .kcard .owner{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--soft);padding-top:7px;border-top:1px solid var(--line)}
  .kcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .kcard .top small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .kcard .gen{width:100%}
  .info-cards .card{display:flex;flex-direction:column;gap:10px}
  .info-cards .card ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13px;background:rgba(0,0,0,.2);border-radius:10px;padding:12px}
  .info-cards .card li{display:flex;gap:9px;align-items:center}
  .info-cards .card li .lucide{width:16px}
  .t-wait{background:linear-gradient(180deg,rgba(246,181,30,.13),var(--panel))}
  .t-arch{background:linear-gradient(180deg,rgba(244,63,94,.13),var(--panel))}
  .t-hist{background:linear-gradient(180deg,rgba(31,213,154,.12),var(--panel))}
  .empty-col{color:var(--dim);font-size:12px;text-align:center;padding:16px 4px}
  .attr-divider{display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
  .report-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .report-table th,.report-table td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  .report-table th{color:var(--muted);font-weight:600}
</style>
</head>
<body>
<script>
const content=PF.shell({title:'Comercial',subtitle:'Gestão de leads e oportunidades',crumbs:[['Clientes'],['Comercial']],search:'Buscar lead, empresa ou contato...',
  actions:`<button class="btn btn-ghost" id="leadReports"><i data-lucide="chart-no-axes-column"></i>Relatórios</button><button class="btn btn-ghost" id="leadReferences"><i data-lucide="tag"></i>Códigos</button><button class="btn btn-primary" id="newLead"><i data-lucide="plus"></i>Novo lead</button>`});

const STAGES=[['novo','Novo lead','var(--blue)'],['contato','Em contato','var(--orange)'],['reuniao','Reunião','var(--purple)'],['proposta','Proposta enviada','var(--yellow)'],['negociacao','Negociação','var(--pink)'],['fechado','Fechado','var(--green)']];
const SOURCES=['Meta Ads','Google Ads','Prospecção','WhatsApp','Site','Indicação','Instagram','Evento'];
const SRC={'Meta Ads':'pink','Google Ads':'yellow','Prospecção':'blue','WhatsApp':'green','Site':'orange','Indicação':'purple','Instagram':'pink','Evento':'gray'};
const CONTRACT={elab:['Contrato em elaboração','blue'],aguard:['Aguardando assinatura','yellow'],assin:['Contrato assinado','green']};
const WAIT=['Sem resposta (com data de retorno)','Retomada futura (ex.: 3 meses)','Aguardando definição do cliente'];
const ARCH=['Não teve interesse','Desqualificado (fora do perfil)','Não respondeu (após tentativas)','Fechou com outra empresa'];
const CHANNELS=[['manual','Cadastro manual'],['form','Formulário do site'],['whatsapp','WhatsApp manual'],['meta_form','Formulário Meta'],['whatsapp_api','WhatsApp integrado'],['integration','Outra integração']];
let leads=[],owners=[],tab='andamento',filters={src:'',seg:'',owner:''},q='';
const ownerName=id=>owners.find(o=>o.id===id)?.name||'';
const wa=p=>'https://wa.me/55'+String(p||'').replace(/\D/g,'');
const dateInput=ms=>{if(!ms)return '';const date=new Date(ms);return new Date(ms-date.getTimezoneOffset()*60000).toISOString().slice(0,16);};

async function load(){
  try{const d=await PF.api('/api/leads');leads=d.leads;owners=d.owners;}catch(e){PF.toast(e.message,'err');}
  render();
}
async function patch(body,msg){
  try{await PF.api('/api/leads',{method:'PATCH',body});if(msg)PF.toast(msg,'ok');}catch(e){PF.toast(e.message,'err');}
  await load();
}

function card(l){
  const c=CONTRACT[l.contract_status];
  return `<div class="kcard" data-id="${l.id}">
    <div class="top"><div><b>${PF.esc(l.company)}</b><small>${PF.esc(l.segment||'—')}</small></div><button class="icon-btn" data-open="${l.id}" aria-label="Abrir"><i data-lucide="ellipsis-vertical"></i></button></div>
    ${l.source?`<span class="badge b-${SRC[l.source]||'gray'} src">${PF.esc(l.source)}</span>`:''}
    ${l.contact_name?`<div class="contact"><i data-lucide="user"></i>${PF.esc(l.contact_name)}</div>`:''}
    <div class="acts">${l.phone?`<a class="wa" href="${wa(l.phone)}" target="_blank" rel="noopener"><i data-lucide="message-circle"></i>WhatsApp</a><a class="icon-btn" href="tel:${l.phone.replace(/\D/g,'')}" aria-label="Ligar"><i data-lucide="phone"></i></a>`:''}
      ${l.email?`<a class="icon-btn" href="mailto:${PF.esc(l.email)}" aria-label="Email"><i data-lucide="mail"></i></a>`:''}</div>
    ${l.stage==='fechado'?(c?`<a href="contratos.html" class="badge b-${c[1]}" style="align-self:flex-start"><i data-lucide="file-text" style="width:13px"></i>${c[0]}</a>`
      :`<button class="btn btn-primary btn-sm gen" data-gen="${l.id}"><i data-lucide="file-plus"></i>Gerar contrato</button>`):''}
    <div class="owner">${l.owner_id?PF.avatar(ownerName(l.owner_id))+PF.esc(ownerName(l.owner_id)):'<span class="avatar sm" style="background:#2a313c"><i data-lucide="user" style="width:13px"></i></span><span class="muted">Sem responsável</span>'}</div>
  </div>`;
}

function render(){
  const by=s=>leads.filter(l=>l.situation===s);
  const match=l=>(!filters.src||l.source===filters.src)&&(!filters.seg||l.segment===filters.seg)&&(!filters.owner||l.owner_id===filters.owner)&&(!q||(l.company+' '+l.contact_name+' '+l.email+' '+l.phone).toLowerCase().includes(q));
  const active=by('andamento').filter(match);
  content.innerHTML=`
  <div class="tabs">${[['andamento','Em andamento'],['espera','Em espera'],['arquivado','Arquivados']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}<span class="count">${by(k).length}</span></button>`).join('')}</div>
  ${tab==='andamento'?`
  <div class="filters">
    ${PF.select('fSrc','Origem',[['','Origem: Todas'],...[...new Set(leads.map(l=>l.source).filter(Boolean))].map(s=>[s,s])])}
    ${PF.select('fSeg','Segmento',[['','Segmento: Todos'],...[...new Set(leads.map(l=>l.segment).filter(Boolean))].map(s=>[s,s])])}
    ${PF.select('fOwner','Responsável',[['','Responsável: Todos'],...owners.map(o=>[o.id,o.name])])}
  </div>
  <div class="kanban mb">${STAGES.map(([k,label,c])=>{const items=active.filter(l=>l.stage===k);return `<div class="col" data-col="${k}"><div class="col-head" style="--c:${c}">${label}<span class="n">${items.length}</span></div>${items.map(card).join('')||`<div class="empty-col">${k==='novo'&&!leads.length?'Clique em "Novo lead" para começar':'Arraste um lead para cá'}</div>`}</div>`;}).join('')}</div>`
  :`<div class="card mb">${by(tab).filter(match).length?`<table class="tbl"><thead><tr><th>Lead</th><th>Motivo</th>${tab==='espera'?'<th>Retomar em</th>':''}<th>Responsável</th><th></th></tr></thead><tbody>
    ${by(tab).filter(match).map(l=>`<tr><td><div class="who">${PF.chip(l.company)}<div><b>${PF.esc(l.company)}</b><small>${PF.esc(l.segment||'—')}</small></div></div></td><td>${PF.esc(l.reason)}</td>${tab==='espera'?`<td>${l.return_at?l.return_at.split('-').reverse().join('/'):'—'}</td>`:''}<td>${PF.esc(ownerName(l.owner_id)||'—')}</td>
      <td class="right"><button class="btn btn-ghost btn-sm" data-react="${l.id}"><i data-lucide="rotate-ccw"></i>Reativar oportunidade</button></td></tr>`).join('')}
    </tbody></table>`:`<div class="empty"><i data-lucide="inbox"></i><div>Nenhum lead ${tab==='espera'?'em espera':'arquivado'}.</div></div>`}</div>`}
  <section class="grid g3 info-cards">
    <div class="card t-wait"><div class="row"><div class="ico md c-yellow round"><i data-lucide="clock"></i></div><div><b>Em espera</b><p class="muted small">Leads que podem voltar a negociar, com data de retomada e responsável.</p></div></div>
      <ul>${WAIT.map(t=>`<li><i data-lucide="clock" style="color:var(--yellow)"></i>${t}</li>`).join('')}</ul></div>
    <div class="card t-arch"><div class="row"><div class="ico md c-pink round"><i data-lucide="mail-x"></i></div><div><b>Arquivados</b><p class="muted small">Leads encerrados, com o motivo registrado e histórico salvo.</p></div></div>
      <ul>${ARCH.map(t=>`<li><i data-lucide="square-x" style="color:var(--pink)"></i>${t}</li>`).join('')}</ul></div>
    <div class="card t-hist"><div class="row"><div class="ico md c-green round"><i data-lucide="file-text"></i></div><div><b>Do fechamento ao cliente</b><p class="muted small">Em <b>Fechado</b>, clique em <b>Gerar contrato</b>. Quando o contrato for assinado, o cliente é criado sozinho com os dados deste cadastro.</p></div></div>
      <a class="btn btn-ghost" style="margin-top:auto" href="contratos.html"><i data-lucide="file-signature"></i>Ver contratos</a></div>
  </section>`;
  PF.icons();
  content.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  if(tab==='andamento'){
    const bind=(id,key)=>{const s=content.querySelector('#'+id);s.value=filters[key];s.onchange=()=>{filters[key]=s.value;render();};};
    bind('fSrc','src');bind('fSeg','seg');bind('fOwner','owner');
    PF.kanban(content.querySelector('.kanban'),(id,col)=>{const l=leads.find(x=>x.id===id);if(l.stage===col)return;l.stage=col;patch({id,stage:col},`${l.company} → ${STAGES.find(s=>s[0]===col)[1]}`);});
    content.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLead(leads.find(l=>l.id===b.dataset.open)));
    content.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>generate(leads.find(l=>l.id===b.dataset.gen)));
  }
  content.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>patch({id:b.dataset.react,situation:'andamento'},'Lead voltou para o funil.'));
}

function fields(l={}){
  return `<div class="grid g2"><label class="field"><span>Empresa</span><input class="input" name="company" required value="${PF.esc(l.company||'')}"></label>
    <label class="field"><span>Segmento</span><input class="input" name="segment" value="${PF.esc(l.segment||'')}" placeholder="Ex.: Saúde / Estética"></label></div>
  <div class="grid g2"><label class="field"><span>Contato</span><input class="input" name="contact_name" value="${PF.esc(l.contact_name||'')}"></label>
    <label class="field"><span>WhatsApp</span><input class="input" name="phone" value="${PF.esc(l.phone||'')}" placeholder="(48) 9 0000-0000"></label></div>
  <div class="grid g2"><label class="field"><span>Email</span><input class="input" name="email" type="email" value="${PF.esc(l.email||'')}"></label>
    <label class="field"><span>Origem</span><select class="select-in" name="source"><option value="">—</option>${SOURCES.map(o=>`<option ${o===l.source?'selected':''}>${o}</option>`).join('')}</select></label></div>
  <div class="grid g2"><label class="field"><span>Interesse</span><input class="input" name="interest" value="${PF.esc(l.interest||'')}" placeholder="Ex.: Gestão + Tráfego"></label>
    <label class="field"><span>Responsável comercial</span><select class="select-in" name="owner_id"><option value="">Sem responsável</option>${owners.map(o=>`<option value="${o.id}" ${o.id===l.owner_id?'selected':''}>${PF.esc(o.name)}</option>`).join('')}</select></label></div>
  <div class="attr-divider"><b>Origem do Lead</b><span class="muted small">Atribuição e parâmetros de campanha</span></div>
  <div class="grid g2"><label class="field"><span>Canal de entrada</span><select class="select-in" name="lead_source">${CHANNELS.map(([v,label])=>`<option value="${v}" ${v===(l.lead_source||'manual')?'selected':''}>${label}</option>`).join('')}</select></label>
    <label class="field"><span>Plataforma</span><input class="input" name="platform" value="${PF.esc(l.platform||'')}" placeholder="Meta, Google, TikTok..."></label></div>
  <div class="grid g2"><label class="field"><span>Campanha</span><input class="input" name="campaign_name" value="${PF.esc(l.campaign_name||'')}"></label>
    <label class="field"><span>Anúncio ou criativo</span><input class="input" name="ad_name" value="${PF.esc(l.ad_name||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>Código de origem da campanha</span><input class="input" name="reference_code" value="${PF.esc(l.reference_code||'')}" maxlength="40" autocomplete="off"></label>
    <label class="field"><span>Método de identificação</span><select class="select-in" name="attribution_method">${[['automatic','Automático'],['integration','Integração'],['manual','Manual']].map(([v,label])=>`<option value="${v}" ${v===(l.attribution_method||'manual')?'selected':''}>${label}</option>`).join('')}</select></label></div>
  <label class="field"><span>Data da conversão</span><input class="input" name="conversion_at" type="datetime-local" value="${dateInput(l.conversion_at||l.created_at)}"></label>
  <div class="small" data-reference-status aria-live="polite"></div>
  <div class="grid g2"><label class="field"><span>UTM source</span><input class="input" name="utm_source" value="${PF.esc(l.utm_source||'')}"></label>
    <label class="field"><span>UTM medium</span><input class="input" name="utm_medium" value="${PF.esc(l.utm_medium||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM campaign</span><input class="input" name="utm_campaign" value="${PF.esc(l.utm_campaign||'')}"></label>
    <label class="field"><span>UTM content</span><input class="input" name="utm_content" value="${PF.esc(l.utm_content||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM term</span><input class="input" name="utm_term" value="${PF.esc(l.utm_term||'')}"></label>
    <label class="field"><span>gclid</span><input class="input" name="gclid" value="${PF.esc(l.gclid||'')}"></label></div>
  <label class="field"><span>fbclid</span><input class="input" name="fbclid" value="${PF.esc(l.fbclid||'')}"></label>`;
}
const formData=f=>{
  const d=Object.fromEntries(new FormData(f));
  if(d.conversion_at)d.conversion_at=new Date(d.conversion_at).toISOString();
  return d;
};

async function resolveReference(form){
  const input=form.elements.namedItem('reference_code'),status=form.querySelector('[data-reference-status]');
  const code=String(input?.value||'').trim();
  if(!code){if(status)status.textContent='';return true;}
  if(String(input.dataset.initial||'')===code){if(status)status.textContent='';return true;}
  try{
    const {reference:r}=await PF.api('/api/lead-references?code='+encodeURIComponent(code));
    if(String(input.dataset.initial||'')!==code){
      for(const [key,value] of Object.entries({source:'WhatsApp',lead_source:'whatsapp',attribution_method:'manual',
        platform:r.platform,campaign_name:r.campaign_name,ad_name:r.ad_name,utm_source:r.utm_source,utm_medium:r.utm_medium,
        utm_campaign:r.utm_campaign,utm_content:r.utm_content,utm_term:r.utm_term,gclid:r.gclid,fbclid:r.fbclid})){
        const field=form.elements.namedItem(key);if(field)field.value=value||'';
      }
    }
    if(status){status.textContent=`Código válido: ${r.campaign_name}${r.ad_name?' · '+r.ad_name:''}`;status.className='small note info';}
    return true;
  }catch(e){if(status){status.textContent=e.message;status.className='small note err';}return false;}
}
function bindReference(form){
  const input=form.elements.namedItem('reference_code');
  if(!input)return;
  input.dataset.initial=String(input.value||'');
  input.addEventListener('blur',()=>resolveReference(form));
}

function openLead(l){
  const c=CONTRACT[l.contract_status];
  const m=PF.modal(`<div class="modal-head"><div><h3>${PF.esc(l.company)}</h3><p class="muted small">Data da conversão: ${new Date(l.conversion_at||l.created_at).toLocaleDateString('pt-BR')}</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="f">
      ${fields(l)}
      <label class="field"><span>Etapa do funil</span><select class="select-in" name="stage">${STAGES.map(([k,lb])=>`<option value="${k}" ${k===l.stage?'selected':''}>${lb}</option>`).join('')}</select></label>
      <label class="field"><span>Anotações (triagem, interações, combinados)</span><textarea class="input" name="notes" style="min-height:90px">${PF.esc(l.notes||'')}</textarea></label>
      <div class="card flat" id="leadHistory"><span class="muted small">Carregando histórico...</span></div>
      ${c?`<a class="note info" href="contratos.html"><i data-lucide="file-text"></i><div>${c[0]}. <b>Ver em Contratos →</b></div></a>`:''}
      <div class="row wrap" style="gap:8px">
        ${!c?`<button type="button" class="btn btn-primary btn-sm" id="gen"><i data-lucide="file-plus"></i>Gerar contrato</button>`:''}
        <button type="button" class="btn btn-ghost btn-sm" id="wait"><i data-lucide="clock"></i>Colocar em espera</button>
        <button type="button" class="btn btn-ghost btn-sm" id="arch"><i data-lucide="archive"></i>Arquivar</button>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Salvar</button></div>
    </form>`,{side:true});
  const f=m.el.querySelector('#f');
  bindReference(f);
  f.onsubmit=async e=>{e.preventDefault();if(!await resolveReference(f))return;m.close();await patch({id:l.id,...formData(f)},'Lead atualizado.');};
  showLeadHistory(l.id,m.el.querySelector('#leadHistory'));
  const g=m.el.querySelector('#gen');if(g)g.onclick=()=>{m.close();generate(l);};
  m.el.querySelector('#wait').onclick=()=>reason(l,'espera');
  m.el.querySelector('#arch').onclick=()=>reason(l,'arquivado');
  function reason(l,kind){
    const opts=kind==='espera'?WAIT:ARCH;
    const r=PF.modal(`<div class="modal-head"><h3>${kind==='espera'?'Colocar em espera':'Arquivar lead'}</h3><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
      <form class="stack" id="r"><label class="field"><span>Motivo</span><select class="select-in" name="reason">${opts.map(o=>`<option>${o}</option>`).join('')}</select></label>
      ${kind==='espera'?'<label class="field"><span>Retomar em</span><input class="input" type="date" name="return_at"></label>':''}
      <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Confirmar</button></div></form>`);
    r.el.querySelector('#r').onsubmit=async e=>{e.preventDefault();const d=formData(e.target);r.close();m.close();await patch({id:l.id,situation:kind,...d},kind==='espera'?'Lead em espera.':'Lead arquivado.');};
  }

  async function showLeadHistory(id,box){
    try{
      const data=await PF.api('/api/leads/history?lead_id='+encodeURIComponent(id));
      const attr=data.history.map(item=>{
        let values={};try{values=JSON.parse(item.new_data);}catch{}
        return `<li><b>${PF.esc(item.changed_by_name||'Sistema')}</b> · ${PF.fmtDate(item.created_at,{day:'2-digit',month:'2-digit',year:'numeric'})} ${PF.fmtTime(item.created_at)}<div class="muted small">${PF.esc(Object.entries(values).map(([k,v])=>`${k}: ${v||'—'}`).join(' · '))}</div></li>`;
      }).join('');
      const stage=data.stages.map(item=>`<li><b>${PF.esc(item.changed_by_name||'Sistema')}</b> · ${PF.fmtDate(item.changed_at,{day:'2-digit',month:'2-digit',year:'numeric'})} ${PF.fmtTime(item.changed_at)}<div class="muted small">${PF.esc(item.from_stage?`${item.from_stage} → ${item.to_stage}`:`Lead criado em ${item.to_stage}`)}</div></li>`).join('');
      box.innerHTML=`<b>Histórico</b><div class="grid g2" style="margin-top:10px"><div><span class="muted small">Alterações da origem</span><ul class="small" style="padding-left:18px">${attr||'<li>Sem alterações.</li>'}</ul></div><div><span class="muted small">Etapas do funil</span><ul class="small" style="padding-left:18px">${stage||'<li>Sem alterações.</li>'}</ul></div></div>`;
    }catch(e){box.innerHTML=`<span class="small" style="color:var(--pink)">Não foi possível carregar o histórico: ${PF.esc(e.message)}</span>`;}
  }
}

function generate(l){
  PF.contractForm({lead:l,onDone:async()=>{await load();}});
}

function referenceFormFields(r={}){
  return `<div class="grid g2"><label class="field"><span>Código de referência</span><input class="input" name="code" required maxlength="40" value="${PF.esc(r.code||'')}" ${r.id?'readonly':''}></label>
    <label class="field"><span>Plataforma de origem</span><input class="input" name="platform" required value="${PF.esc(r.platform||'')}" placeholder="Meta Ads, Google Ads..."></label></div>
  <div class="grid g2"><label class="field"><span>Campanha vinculada</span><input class="input" name="campaign_name" required value="${PF.esc(r.campaign_name||'')}"></label>
    <label class="field"><span>Anúncio ou criativo</span><input class="input" name="ad_name" value="${PF.esc(r.ad_name||'')}"></label></div>
  <div class="grid g3"><label class="field"><span>ID da campanha</span><input class="input" name="campaign_id" value="${PF.esc(r.campaign_id||'')}"></label>
    <label class="field"><span>ID do anúncio</span><input class="input" name="ad_id" value="${PF.esc(r.ad_id||'')}"></label>
    <label class="field"><span>ID do formulário</span><input class="input" name="form_id" value="${PF.esc(r.form_id||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM source</span><input class="input" name="utm_source" value="${PF.esc(r.utm_source||'')}"></label>
    <label class="field"><span>UTM medium</span><input class="input" name="utm_medium" value="${PF.esc(r.utm_medium||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM campaign</span><input class="input" name="utm_campaign" value="${PF.esc(r.utm_campaign||'')}"></label>
    <label class="field"><span>UTM content</span><input class="input" name="utm_content" value="${PF.esc(r.utm_content||'')}"></label></div>
  <div class="grid g2"><label class="field"><span>UTM term</span><input class="input" name="utm_term" value="${PF.esc(r.utm_term||'')}"></label>
    <label class="field"><span>gclid</span><input class="input" name="gclid" value="${PF.esc(r.gclid||'')}"></label></div>
  <label class="field"><span>fbclid</span><input class="input" name="fbclid" value="${PF.esc(r.fbclid||'')}"></label>`;
}

async function editReference(reference=null){
  const m=PF.modal(`<div class="modal-head"><div><h3>${reference?'Editar código':'Novo código de origem'}</h3><p class="muted small">O código deve ser incluído na mensagem pré-preenchida do anúncio.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <form class="stack" id="referenceForm">${referenceFormFields(reference||{})}<div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Salvar código</button></div></form>`,{wide:true});
  m.el.querySelector('#referenceForm').onsubmit=async e=>{
    e.preventDefault();const body=Object.fromEntries(new FormData(e.target));
    try{
      await PF.api('/api/lead-references',{method:reference?'PATCH':'POST',body:reference?{...body,id:reference.id}:body});
      m.close();PF.toast('Código salvo.','ok');showReferences();
    }catch(error){PF.toast(error.message,'err');}
  };
}

async function showReferences(){
  const m=PF.modal(`<div class="modal-head"><div><h3>Códigos de origem</h3><p class="muted small">Vincule códigos de mensagens do WhatsApp às campanhas e anúncios.</p></div><div class="row"><button class="btn btn-primary btn-sm" id="addReference"><i data-lucide="plus"></i>Novo código</button><button class="icon-btn" data-close><i data-lucide="x"></i></button></div></div><div id="referenceList" class="card flat">Carregando...</div>`,{wide:true});
  const draw=async()=>{
    const box=m.el.querySelector('#referenceList');
    try{
      const {references}=await PF.api('/api/lead-references');
      box.innerHTML=references.length?`<table class="report-table"><thead><tr><th>Código</th><th>Plataforma</th><th>Campanha / anúncio</th><th>Criado em</th><th>Status</th><th></th></tr></thead><tbody>${references.map(r=>`<tr>
        <td><b>${PF.esc(r.code)}</b></td><td>${PF.esc(r.platform)}</td><td>${PF.esc(r.campaign_name)}${r.ad_name?' · '+PF.esc(r.ad_name):''}</td>
        <td>${PF.fmtDate(r.created_at,{day:'2-digit',month:'2-digit',year:'numeric'})}</td>
        <td>${r.active?'Ativo':'Inativo'}</td><td class="right"><button class="btn btn-ghost btn-sm" data-edit-reference="${r.id}">Editar</button>
        <button class="btn btn-ghost btn-sm" data-toggle-reference="${r.id}" data-active="${r.active}">${r.active?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum código cadastrado.</div>';
      box.querySelectorAll('[data-edit-reference]').forEach(button=>button.onclick=()=>editReference(references.find(r=>r.id===button.dataset.editReference)));
      box.querySelectorAll('[data-toggle-reference]').forEach(button=>button.onclick=async()=>{
        try{await PF.api('/api/lead-references',{method:'PATCH',body:{id:button.dataset.toggleReference,active:button.dataset.active!=='1'}});await draw();}
        catch(error){PF.toast(error.message,'err');}
      });
    }catch(error){box.textContent=error.message;}
  };
  m.el.querySelector('#addReference').onclick=()=>editReference();
  await draw();
}

async function showLeadReports(){
  const m=PF.modal(`<div class="modal-head"><div><h3>Relatórios de campanhas</h3><p class="muted small">Leads, canais, etapas atuais e clientes por origem.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <div class="grid g2"><label class="field"><span>De</span><input class="input" type="date" id="reportFrom"></label><label class="field"><span>Até</span><input class="input" type="date" id="reportTo"></label></div><div id="reportContent">Carregando...</div>`,{wide:true});
  const draw=async()=>{
    const params=new URLSearchParams(),from=m.el.querySelector('#reportFrom').value,to=m.el.querySelector('#reportTo').value;
    params.set('tz',String(new Date().getTimezoneOffset()));
    if(from)params.set('from',from);if(to)params.set('to',to);
    const box=m.el.querySelector('#reportContent');box.textContent='Carregando...';
    try{
      const data=await PF.api('/api/leads/reports?'+params.toString());
      const table=(title,rows)=>`<section class="card flat mb"><h3>${title}</h3><table class="report-table"><thead><tr><th>Origem</th><th>Leads</th><th>Clientes</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${PF.esc(r.label)}</td><td>${r.leads}</td><td>${r.customers}</td></tr>`).join(''):'<tr><td colspan="3">Sem dados no período.</td></tr>'}</tbody></table></section>`;
      box.innerHTML=`<p class="muted small mb">${data.total} lead(s) no período.</p><div class="grid g2">${table('Por plataforma',data.byPlatform)}${table('Por canal de entrada',data.byChannel)}${table('Por campanha',data.byCampaign)}${table('Por anúncio',data.byAd)}</div>
        <section class="card flat"><h3>Funil atual por campanha</h3><table class="report-table"><thead><tr><th>Campanha</th><th>Etapa</th><th>Leads</th><th>Clientes</th></tr></thead><tbody>${data.funnel.length?data.funnel.map(r=>`<tr><td>${PF.esc(r.platform+' · '+r.campaign_name)}</td><td>${PF.esc(STAGES.find(s=>s[0]===r.stage)?.[1]||r.stage)}</td><td>${r.leads}</td><td>${r.customers}</td></tr>`).join(''):'<tr><td colspan="4">Sem dados no período.</td></tr>'}</tbody></table></section>`;
    }catch(error){box.textContent=error.message;}
  };
  m.el.querySelector('#reportFrom').onchange=draw;m.el.querySelector('#reportTo').onchange=draw;draw();
}

document.getElementById('newLead').onclick=()=>{
  const m=PF.modal(`<div class="modal-head"><div><h3>Novo lead</h3><p class="muted small">Entra na coluna "Novo lead". Esses dados vão para o contrato e para o cadastro do cliente.</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
  <form class="stack" id="nl">${fields({})}
  <label class="field"><span>Anotações da triagem</span><textarea class="input" name="notes" style="min-height:80px"></textarea></label>
  <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary">Adicionar ao funil</button></div></form>`,{side:true});
  const form=m.el.querySelector('#nl');bindReference(form);
  form.onsubmit=async e=>{e.preventDefault();if(!await resolveReference(form))return;try{await PF.api('/api/leads',{method:'POST',body:formData(form)});m.close();PF.toast('Lead adicionado em Novo lead.','ok');load();}catch(x){PF.toast(x.message,'err');}};
};
document.getElementById('leadReferences').onclick=showReferences;
document.getElementById('leadReports').onclick=showLeadReports;
document.getElementById('globalSearch').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();load();
</script>
</body>
</html>
