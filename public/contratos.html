<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Contratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<script src="js/contrato-form.js"></script>
<style>
  .type{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;padding:22px}
  .type.g{background:linear-gradient(135deg,rgba(139,92,246,.16),var(--panel))}
  .type.p{background:linear-gradient(135deg,rgba(255,88,11,.14),var(--panel))}
  .type h2{font-size:20px;margin:10px 0 6px}
  .type p{color:var(--soft);font-size:13px;line-height:1.5}
  .type ul{list-style:none;border-left:1px solid var(--line-2);padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .type ul small{color:var(--muted);display:block;margin-bottom:2px}
  .type li{display:flex;gap:8px;align-items:center}
  .type li .lucide{width:15px;color:var(--muted)}
  .type .more{margin-top:14px;display:inline-flex}
  .flow .step .lucide{width:22px;height:22px;color:var(--orange)}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  @media (max-width:700px){.type{grid-template-columns:1fr}.type ul{border-left:0;padding-left:0}}
</style>
</head>
<body>
<script>
const content=PF.shell({title:'Contratos',subtitle:'Modelos, elaboração, assinatura e acompanhamento.',crumbs:[['Clientes'],['Contratos']],search:'Buscar cliente ou contrato...',
  actions:`<button class="btn btn-primary" id="newC"><i data-lucide="plus"></i>Novo contrato</button>`});
const ST={elab:['Em elaboração','blue'],aguard:['Aguardando assinatura','yellow'],assin:['Assinado','green'],canc:['Cancelado','pink']};
let D={contracts:[],closed:[],owners:[]},tab='all',q='';
const ownerName=id=>D.owners.find(o=>o.id===id)?.name||'—';
const fmt=ms=>ms?new Date(ms).toLocaleDateString('pt-BR'):'—';

async function load(){
  try{D=await PF.api('/api/contracts');}catch(e){PF.toast(e.message,'err');}
  render();
}
async function act(id,action,extra={},msg){
  try{const r=await PF.api('/api/contracts',{method:'PATCH',body:{id,action,...extra}});if(msg)PF.toast(typeof msg==='function'?msg(r):msg,'ok');}catch(e){PF.toast(e.message,'err');}
  load();
}

function actions(c){
  const b=(a,label,cls='btn-ghost',icon='')=>`<button class="btn ${cls} btn-sm" data-a="${a}" data-id="${c.id}">${icon?`<i data-lucide="${icon}"></i>`:''}${label}</button>`;
  const temModelo=c.kind==='Gestão'||/site|website|e-?commerce|loja/i.test(c.model);
  const pdf=temModelo?`<a class="icon-btn" title="Ver PDF" href="/api/contracts/pdf?id=${c.id}" target="_blank" rel="noopener"><i data-lucide="file-text"></i></a><a class="icon-btn" title="Baixar PDF" href="/api/contracts/pdf?id=${c.id}&download=1"><i data-lucide="download"></i></a>`:'';
  const enviar=temModelo?b('send',c.status==='elab'?'Enviar ao cliente':'Reenviar',c.status==='elab'?'btn-primary':'btn-ghost','send'):(c.status==='elab'?b('mark','Marcar como enviado','btn-primary','send'):'');
  if(c.status==='elab')return pdf+b('edit','Editar','btn-ghost','pencil')+enviar+b('cancel','Cancelar');
  if(c.status==='aguard')return pdf+b('edit','Editar','btn-ghost','pencil')+enviar+b('sign','Marcar como assinado','btn-primary','check')+b('cancel','Cancelar');
  if(c.status==='assin')return pdf+(c.client_id?`<a class="btn btn-ghost btn-sm" href="clientes.html?id=${c.client_id}"><i data-lucide="contact"></i>Ver cliente</a>`:'');
  return c.cancelled_reason?`<span class="muted tiny">${PF.esc(c.cancelled_reason)}</span>`:'';
}
// Escolher como enviar: email (PDF anexo), WhatsApp (link do PDF) ou só marcar como enviado.
function sendMenu(c){
  const m=PF.modal(`<div class="modal-head"><div><h3>Enviar contrato</h3><p class="muted small">${PF.esc(c.company)}${c.emailed_to?' · último email: '+PF.esc(c.emailed_to):''}</p></div><button class="icon-btn" data-close><i data-lucide="x"></i></button></div>
    <div class="stack">
      <button class="btn btn-ghost" style="justify-content:flex-start;padding:14px" data-v="email"><i data-lucide="mail"></i><div style="text-align:left"><b>Por email</b><div class="muted tiny">O PDF vai anexado na mensagem.</div></div></button>
      <button class="btn btn-ghost" style="justify-content:flex-start;padding:14px" data-v="whatsapp"><i data-lucide="message-circle"></i><div style="text-align:left"><b>Pelo WhatsApp</b><div class="muted tiny">Abre o WhatsApp com a mensagem e o link do PDF (vale 30 dias).</div></div></button>
      <button class="btn btn-ghost" style="justify-content:flex-start;padding:14px" data-v="mark"><i data-lucide="check"></i><div style="text-align:left"><b>Já enviei por fora (ex.: ClickSign)</b><div class="muted tiny">Só muda o status para "Aguardando assinatura".</div></div></button>
    </div>`);
  m.el.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{m.close();const v=x.dataset.v;
    if(v==='mark')act(c.id,'send',{},'Contrato marcado como enviado.');else PF.contractSend(c,v,load);});
}

function render(){
  const n=k=>D.contracts.filter(c=>c.status===k).length;
  const list=D.contracts.filter(c=>(tab==='all'||c.status===tab)&&(!q||(c.company+' '+c.model+' '+c.contact_name).toLowerCase().includes(q)));
  content.innerHTML=`
  ${D.closed.length?`<div class="note mb"><i data-lucide="bell-ring"></i><div><b>${D.closed.length} lead(s) fechado(s) sem contrato:</b> ${D.closed.map(l=>PF.esc(l.company)).join(', ')}. <a class="link" href="#" id="fromLead">Gerar contrato agora</a></div></div>`:''}
  <section class="grid g2 mb">
    ${[['g','Gestão','users','purple','Contratos para serviços recorrentes de marketing, como gestão de redes sociais, conteúdo, tráfego e presença digital.'],['p','Projetos','laptop','orange','Contratos para implementação de projetos como websites, e-commerce, identidade visual e outros.']].map(([k,t,i,c,d])=>`
    <div class="card type ${k} fade"><div><div class="ico c-${c}"><i data-lucide="${i}"></i></div><h2>${t}</h2><p>${d}</p></div>
      <ul><small>Principais modelos:</small>${PF.contractModels[t].map(m=>`<li><i data-lucide="file-text"></i>${m}</li>`).join('')}</ul></div>`).join('')}
  </section>
  <div class="card mb">
    <div class="card-head"><h2>Contratos</h2></div>
    <div class="tabs">${[['all','Todos',D.contracts.length],['elab','Em elaboração',n('elab')],['aguard','Aguardando assinatura',n('aguard')],['assin','Assinados',n('assin')],['canc','Cancelados',n('canc')]].map(([k,l,c])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}<span class="count">${c}</span></button>`).join('')}</div>
    ${list.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Tipo</th><th>Modelo</th><th>Valor</th><th>Status</th><th>Responsável</th><th>Envio</th><th class="right">Ações</th></tr></thead><tbody>
    ${list.map(c=>`<tr><td><div class="who">${PF.chip(c.company)}<div><b>${PF.esc(c.company)}</b><small>${PF.esc(c.segment||c.contact_name||'—')}</small></div></div></td><td>${c.kind}</td><td>${PF.esc(c.model)}</td><td class="nowrap">${PF.esc(c.value||'—')}</td>
      <td>${PF.badge(...ST[c.status])}</td><td><div class="row">${PF.avatar(ownerName(c.owner_id))}${PF.esc(ownerName(c.owner_id))}</div></td><td>${fmt(c.sent_at)}</td><td><div class="acts">${actions(c)}</div></td></tr>`).join('')}
    </tbody></table></div>`:`<div class="empty"><i data-lucide="file-text"></i><div>Nenhum contrato aqui ainda. Gere a partir de um lead em <a class="link" href="comercial.html">Comercial → Fechado</a>.</div></div>`}
  </div>
  <div class="card"><div class="card-head"><div><h2>Fluxo do contrato</h2><p>Do fechamento no CRM ao cadastro do cliente.</p></div></div>
    <div class="flow">${[['handshake','Negociação fechada','No Comercial, coluna Fechado: "Gerar contrato".'],['file-text','Selecionar modelo','Escolhe o modelo de Gestão ou Projetos.'],['pencil','Preencher contrato','Dados do cliente já vêm do cadastro do lead, editáveis.'],['send','Enviar para assinatura','O contrato vai para "Aguardando assinatura".'],['check-check','Contrato assinado','"Marcar como assinado" cria o cliente automaticamente.'],['users','Cliente ativo','O cliente aparece em Clientes, pronto para o onboarding.']].map(([i,t,d],k,a)=>`<div class="step"><div class="row"><span class="n">${k+1}</span><i data-lucide="${i}"></i></div><b>${t}</b><p>${d}</p></div>${k<a.length-1?'<i data-lucide="arrow-right" class="arrow"></i>':''}`).join('')}</div>
  </div>`;
  PF.icons();
  content.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  const fl=content.querySelector('#fromLead');if(fl)fl.onclick=e=>{e.preventDefault();PF.contractForm({closed:D.closed,onDone:load});};
  content.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const c=D.contracts.find(x=>x.id===b.dataset.id),a=b.dataset.a;
    if(a==='edit')return PF.contractForm({contract:c,onDone:load});
    if(a==='send')return sendMenu(c);
    if(a==='mark')return act(c.id,'send',{},'Contrato marcado como enviado.');
    if(a==='cancel'){const r=prompt('Motivo do cancelamento:');if(r)act(c.id,'cancel',{reason:r},'Contrato cancelado.');return;}
    if(a==='sign'){
      if(!confirm(`Confirmar que ${c.company} assinou o contrato?\n\nO cliente será criado automaticamente em Clientes com os dados do cadastro.`))return;
      act(c.id,'sign',{},()=>`Contrato assinado! ${c.company} agora está em Clientes.`);
    }
  });
}
document.getElementById('newC').onclick=()=>PF.contractForm({closed:D.closed,onDone:load});
document.getElementById('globalSearch').oninput=e=>{q=e.target.value.toLowerCase();render();};
render();load();
</script>
</body>
</html>
