<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nova senha • Periférica</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff580b;--muted:#8a8a8a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;font-family:"Inter",ui-sans-serif,system-ui,sans-serif;background:#000;color:#fff}
.showcase{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;border-right:1px solid #ffffff0d;padding:32px}
.showcase img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.1;transform:scale(1.5);pointer-events:none}
.showcase h2{position:relative;margin:0;font-size:clamp(40px,4.6vw,64px);font-weight:900;text-transform:uppercase;letter-spacing:-.05em;line-height:1}
.accent{color:var(--orange)}
.panel{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px;background:#151515}
.card{width:min(380px,100%)}
.brand{text-align:center;margin-bottom:32px}
.brand img{height:44px;max-width:100%;object-fit:contain;margin-bottom:24px}
h1{font-size:24px;font-weight:900;margin:0;text-transform:uppercase;letter-spacing:-.03em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:600;line-height:1.5}
label{display:block;margin-bottom:14px;font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
input{font:inherit;display:block;width:100%;margin-top:6px;background:#000;border:1px solid #ffffff1a;border-radius:3px;padding:13px 18px;color:#fff;font-size:14px;font-weight:700;letter-spacing:normal;text-transform:none}
input:focus{border-color:var(--orange);outline:none}
.btn{font:inherit;display:block;text-align:center;text-decoration:none;width:100%;border:0;border-radius:3px;padding:16px;background:var(--orange);color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.16em;cursor:pointer;box-shadow:0 12px 30px #ff580b33;margin-top:10px}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 8px}
.msg{font-size:13px;font-weight:700;text-align:center;min-height:20px;margin:16px 0 0;line-height:1.5}
.msg.err{color:#f87171}.msg.ok{color:#4ade80}
@media(max-width:900px){.showcase{display:none}.panel{background:#111}}
</style>
</head>
<body>
<section class="showcase" aria-hidden="true"><img src="brand/simbolo-periferica.png" alt=""><h2>Peri<span class="accent">férica</span></h2></section>
<section class="panel"><main class="card">
  <div class="brand"><img src="brand/logo-periferica.png" alt="Periférica"><h1>Nova senha</h1><p>Crie uma nova senha para entrar no sistema.</p></div>
  <form id="f">
    <label>Nova senha<input id="p1" type="password" autocomplete="new-password" required minlength="8" maxlength="128" autofocus></label>
    <p class="hint">Use pelo menos 8 caracteres.</p>
    <label>Repita a nova senha<input id="p2" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
    <button class="btn" id="go" type="submit">Salvar nova senha</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <a class="btn" id="back" href="login.html" hidden>Ir para o login</a>
</main></section>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
// Tira o código da barra de endereço (não fica no histórico nem é compartilhado sem querer).
history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id),msg=$('msg');
if(!/^[0-9a-f]{64}$/.test(token)){msg.className='msg err';msg.textContent='Link inválido. Peça um novo em "Esqueci minha senha" na tela de login.';$('go').disabled=true;$('back').hidden=false;}
$('f').onsubmit=async e=>{
  e.preventDefault();msg.className='msg';msg.textContent='';
  if($('p1').value!==$('p2').value){msg.className='msg err';msg.textContent='As duas senhas não são iguais.';return;}
  const b=$('go');b.disabled=true;b.textContent='Salvando…';
  try{
    const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('p1').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error||'Não foi possível salvar.');
    $('f').hidden=true;msg.className='msg ok';$('f').after(msg);msg.textContent='Senha alterada! Agora é só entrar com a nova senha.';$('back').hidden=false;
  }catch(err){msg.className='msg err';msg.textContent=err.message;b.disabled=false;b.textContent='Salvar nova senha';}
};
</script>
<script src="js/password-eye.js"></script>
</body>
</html>
