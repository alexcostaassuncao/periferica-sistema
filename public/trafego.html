<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periférica · Tráfego</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/app.js"></script>
<style>
  .top{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
  .ring{position:relative;width:160px;height:160px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring b{font-size:20px}.ring small{color:var(--muted);font-size:12px}
  .inv{display:flex;gap:20px;align-items:center}
  .inv li{list-style:none;display:flex;gap:10px;font-size:13px;margin-bottom:12px}
  .inv li small{display:block;color:var(--muted)}
  .alert{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .alert:last-child{border:0}
  .alert small{display:block;color:var(--muted);font-size:12px}
  .alert time{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .res div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .res b{font-size:19px;display:flex;justify-content:space-between;align-items:baseline}
  .res small{color:var(--muted);font-size:12px}
  .mini td,.mini th{padding:8px 8px;font-size:12px}
  @media (max-width:1100px){.top{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
const content=PF.shell({title:'Tráfego',subtitle:'Campanhas, investimentos e acompanhamento.',crumbs:[['Operação'],['Tráfego']],search:'Buscar campanha, cliente...'});
const thumb=n=>`<span class="tthumb" style="background:linear-gradient(135deg,${PF.colorOf(n)}88,${PF.colorOf(n+'x')}44)"><i data-lucide="megaphone"></i></span>`;
const need=[['Novembro – Captação de leads','Clínica Vida+','Para lançar','solid-orange','10/11/2026',1000,'Abrir'],['Black Friday','Elegance','Saldo baixo','solid-red','15/11/2026',3000,'Ver'],['Ofertas de fim de ano','Mercado Doce','Aguardando cliente','gray','20/11/2026',1500,'Ver'],['Lançamento coleção','Filetto Uniformes','Para lançar','solid-orange','12/11/2026',1000,'Abrir'],['Campanha institucional','ELOWAY APP','Em análise','gray','18/11/2026',2000,'Ver']];
const inv=12500,goal=15000,p=inv/goal*100;
content.innerHTML=`
<section class="grid g4 mb">
  ${PF.kpi({icon:'send',color:'solid-orange',value:'6',label:'Para lançar',arrow:true,active:true})}
  ${PF.kpi({icon:'bar-chart-3',color:'green',value:'14',label:'Campanhas ativas',arrow:true})}
  ${PF.kpi({icon:'triangle-alert',color:'pink',value:'3',label:'Precisam de atenção',arrow:true})}
  ${PF.kpi({icon:'clock',color:'gray',value:'4',label:'Aguardando cliente',arrow:true})}
</section>
<section class="top">
  <div class="card"><div class="card-head"><h2>Campanhas que precisam de ação</h2><span class="row">${PF.demo()}<a class="link" href="#">Ver todas <i data-lucide="chevron-right"></i></a></span></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>Campanha</th><th>Cliente</th><th>Status</th><th>Prazo</th><th>Investimento</th><th class="right">Ação</th></tr></thead><tbody>
    ${need.map(([n,c,s,col,d,v,a])=>`<tr><td><div class="who">${thumb(n)}<b class="small">${n}</b></div></td><td>${c}</td><td>${PF.badge(s,col)}</td><td>${d}</td><td>${PF.brl(v)}</td><td class="right"><button class="btn ${a==='Abrir'?'btn-primary':'btn-outline'} btn-sm" onclick="PF.toast('${a==='Abrir'?'Campanha aberta para configuração.':'Detalhes da campanha'}')">${a}</button></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="stack">
    <div class="card"><div class="card-head"><h2>Investimento do mês</h2><span class="select">${PF.monthLabel(new Date())}<i data-lucide="chevron-down"></i></span></div>
      <div class="inv"><div class="ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#2a313c" stroke-width="4.5"/><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--orange)" stroke-width="4.5" stroke-dasharray="${p} ${100-p}" stroke-linecap="round"/></svg><div><b>${PF.brl(inv)}</b><small>de ${PF.brl(goal)}</small></div></div>
      <ul><li><i class="dot" style="background:var(--orange);margin-top:4px"></i><div>Investido<small>${PF.brl(inv)} (83%)</small></div></li><li><i class="dot" style="background:#6b7482;margin-top:4px"></i><div>Disponível<small>${PF.brl(goal-inv)} (17%)</small></div></li><li><i class="dot" style="background:#3a4250;margin-top:4px"></i><div>Meta mensal<small>${PF.brl(goal)}</small></div></li></ul></div></div>
    <div class="card"><div class="card-head"><h2>Alertas</h2><a class="link" href="#">Ver todos <i data-lucide="chevron-right"></i></a></div>
      <div class="alert"><span class="ico md round c-pink"><i data-lucide="triangle-alert"></i></span><div><b>Elegance</b><small>Saldo da conta abaixo de 20%</small></div><time>há 2h</time></div>
      <div class="alert"><span class="ico md round c-yellow"><i data-lucide="lightbulb"></i></span><div><b>Clínica Vida+</b><small>Campanha aprovada aguardando lançamento</small></div><time>há 5h</time></div>
      <div class="alert"><span class="ico md round c-gray"><i data-lucide="info"></i></span><div><b>Mercado Doce</b><small>Revisar performance da última semana</small></div><time>há 1 dia</time></div></div>
  </div>
</section>
<section class="grid g3">
  <div class="card"><div class="card-head"><h3>Campanhas ativas</h3><a class="link tiny" href="#">Ver todas</a></div><table class="tbl mini"><thead><tr><th>Campanha</th><th>Cliente</th><th>Investimento</th><th>Status</th></tr></thead><tbody>
    ${[['Captação de leads','Clínica Vida+',1000],['Black Friday','Elegance',3000],['Oferta Congelante','Mercado Doce',1500],['Lançamento App','ELOWAY APP',2000]].map(([n,c,v])=>`<tr><td><div class="who">${thumb(n)}${n}</div></td><td>${c}</td><td>${PF.brl(v)}</td><td><span class="row" style="gap:6px"><i class="dot" style="background:var(--green)"></i>Ativa</span></td></tr>`).join('')}</tbody></table></div>
  <div class="card"><div class="card-head"><h3>Próximos lançamentos</h3><a class="link tiny" href="#">Ver todas</a></div><table class="tbl mini"><thead><tr><th>Campanha</th><th>Cliente</th><th>Data</th><th>Status</th></tr></thead><tbody>
    ${[['Novembro – Captação','Clínica Vida+','10/11/2026','Para lançar','var(--orange)'],['Lançamento coleção','Filetto Uniformes','12/11/2026','Para lançar','var(--orange)'],['Campanha institucional','ELOWAY APP','18/11/2026','Em análise','#6b7482'],['Natal – Ofertas','Mercado Doce','25/11/2026','Aguardando cliente','#6b7482']].map(([n,c,d,s,col])=>`<tr><td><div class="who">${thumb(n)}${n}</div></td><td>${c}</td><td>${d}</td><td><span class="row" style="gap:6px"><i class="dot" style="background:${col}"></i>${s}</span></td></tr>`).join('')}</tbody></table></div>
  <div class="card"><div class="card-head"><h3>Resultado das campanhas</h3><a class="link tiny" href="#">Ver mês completo</a></div>
    <div class="res">${[['125.430','Alcance','↑ 12%','up'],['8.942','Cliques','↑ 18%','up'],['R$ 1,48','Custo por clique','↓ 12%','up'],['382','Leads','↑ 26%','up']].map(([v,l,d,k])=>`<div><b>${v}<span class="delta ${k}">${d}</span></b><small>${l}</small></div>`).join('')}</div></div>
</section>`;
PF.icons();
</script>
</body>
</html>
