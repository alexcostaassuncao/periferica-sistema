# Abre os ciclos mensais de produção (todo dia 20 abre o segundo mês seguinte) e gera as entregas do plano.
# Roda todo dia às 06:00 (Brasília): se um dia falhar, o seguinte completa. Nunca duplica ciclos ou entregas.
# Usa os mesmos secrets das publicações agendadas: SITE_URL e CRON_SECRET.
name: Ciclos mensais

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Abrir ciclos e gerar entregas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL/CRON_SECRET não configurados; nada a fazer."; exit 0; fi
          curl --fail-with-body -sS -X POST "$SITE_URL/api/ciclos/run" -H "Authorization: Bearer $CRON_SECRET"
